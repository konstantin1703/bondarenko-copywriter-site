name: Product Flow V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-flow-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V5 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/product-flow-v5.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('admin1Codes.txt','admin1CodesASCII.txt')
          s=s.replace("js=re.sub(pattern,location_v5+'\\n',js,1)","js=re.sub(pattern,lambda _m: location_v5+'\\n',js,1)")
          p.write_text(s,encoding='utf-8')
          PY
          python .github/scripts/product-flow-v5.py
      - name: Validate JavaScript
        run: node --check v4.js
      - name: Commit production update
        run: |
          rm -f .github/scripts/product-flow-v5.py .github/workflows/product-flow-v5.yml v5-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: fix product flow location autocomplete and tech close"
          git push
