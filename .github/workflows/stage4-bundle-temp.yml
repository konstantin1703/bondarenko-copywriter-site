name: Stage 4 Bundle Builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage4-bundle-temp.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Stage 4 branch
        uses: actions/checkout@v4
        with:
          ref: stage4-visual-ux-pass
          fetch-depth: 0

      - name: Build consolidated CSS
        run: python3 tools/build_css_bundle.py

      - name: Commit generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v4-bundle-v1.css index.html
          if git diff --cached --quiet; then
            echo 'Bundle already current.'
          else
            git commit -m 'build: regenerate bundle for stage 4 polish'
            git push origin HEAD:stage4-visual-ux-pass
          fi
