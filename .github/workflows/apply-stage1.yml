name: Apply Stage 1 Maintenance Patch

on:
  push:
    paths:
      - .github/workflows/apply-stage1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        run: python3 tools/apply_stage1_patch.py

      - name: Commit patch and remove one-shot tooling
        run: |
          rm tools/apply_stage1_patch.py .github/workflows/apply-stage1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: complete stage 1 technical stabilization"
          git push origin HEAD:main
