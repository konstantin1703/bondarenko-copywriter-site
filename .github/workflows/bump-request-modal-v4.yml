name: Bump request modal v4

on:
  push:
    paths:
      - '.github/workflows/bump-request-modal-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump request modal JS cache version
        run: python .github/scripts/bump_request_modal_v4.py
      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "fix: load request modal v4"
            git push origin HEAD:main
          fi
