name: One-shot privacy sanitizer

on:
  push:
    paths:
      - ".github/workflows/sanitize-pii.yml"

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove personal identifiers from repository files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/sanitize-pii.yml')
          allowed_suffixes = {
              '.html', '.htm', '.md', '.txt', '.js', '.mjs', '.cjs', '.json', '.xml',
              '.toml', '.yml', '.yaml', '.css', '.svg', '.webmanifest', '.py', '.ts', '.tsx', '.jsx'
          }
          allowed_names = {'README', 'LICENSE', 'CNAME'}

          first = ''.join(chr(c) for c in [1050,1086,1085,1089,1090,1072,1085,1090,1080,1085])
          last = ''.join(chr(c) for c in [1041,1086,1085,1076,1072,1088,1077,1085,1082,1086])
          email_user = ''.join(['byx', 'apc', 'kuu'])
          email = email_user + '@' + ''.join(['gma', 'il.com'])
          phone_digits = ''.join(['+7', '991', '281', '07', '96'])
          phone_plain = ''.join(['7', '991', '281', '07', '96'])

          name_patterns = [
              re.compile(re.escape(first + ' ' + last), re.I),
              re.compile(re.escape(last + ' ' + first), re.I),
              re.compile(r'Konstantin\s+Bondarenko', re.I),
              re.compile(r'Bondarenko\s+Konstantin', re.I),
          ]

          def sanitize_email_tag(match):
              tag = match.group(0)
              tag = re.sub(r'data-user=(["\']).*?\1', 'data-user="privacy-removed"', tag, flags=re.I)
              tag = re.sub(r'data-domain-a=(["\']).*?\1', 'data-domain-a="example"', tag, flags=re.I)
              tag = re.sub(r'data-domain-b=(["\']).*?\1', 'data-domain-b="invalid"', tag, flags=re.I)
              return tag

          def sanitize_phone_tag(match):
              tag = match.group(0)
              tag = re.sub(r'data-country=(["\']).*?\1', 'data-country="+7"', tag, flags=re.I)
              tag = re.sub(r'data-code=(["\']).*?\1', 'data-code="000"', tag, flags=re.I)
              tag = re.sub(r'data-part1=(["\']).*?\1', 'data-part1="000"', tag, flags=re.I)
              tag = re.sub(r'data-part2=(["\']).*?\1', 'data-part2="00"', tag, flags=re.I)
              tag = re.sub(r'data-part3=(["\']).*?\1', 'data-part3="00"', tag, flags=re.I)
              return tag

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              if path.suffix.lower() not in allowed_suffixes and path.name not in allowed_names:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text

              for pattern in name_patterns:
                  text = pattern.sub('Автор', text)

              text = re.sub(r'(?i)mailto:' + re.escape(email), 'mailto:privacy-removed@example.invalid', text)
              text = re.sub(re.escape(email), 'privacy-removed@example.invalid', text, flags=re.I)
              text = re.sub(r'data-user=(["\'])' + re.escape(email_user) + r'\1', 'data-user="privacy-removed"', text, flags=re.I)
              text = re.sub(r'(?is)<[^>]+data-contact=["\']email["\'][^>]*>', sanitize_email_tag, text)

              text = text.replace('tel:' + phone_digits, 'tel:+70000000000')
              text = text.replace(phone_digits, '+7 (000) 000-00-00')
              text = text.replace(phone_plain, '70000000000')
              text = re.sub(r'\+7\s*\(991\)\s*281[-\s]*07[-\s]*96', '+7 (000) 000-00-00', text)
              text = re.sub(r'(?is)<[^>]+data-contact=["\']phone["\'][^>]*>', sanitize_phone_tag, text)

              if path.as_posix() == '.well-known/security.txt':
                  text = re.sub(r'(?im)^Contact:\s*mailto:privacy-removed@example\.invalid\s*$', 'Contact: https://bndstudio.art/', text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Sanitized files:')
          for item in changed:
              print(item)
          PY

          if git diff --quiet; then
            echo "No matching personal identifiers found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove personal contact details"
          git push
