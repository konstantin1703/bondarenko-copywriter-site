name: Stage 5 Visual Capture

on:
  pull_request:
    branches: [main]
    paths:
      - '*.css'
      - '.github/scripts/stage5_capture.mjs'
      - '.github/workflows/stage5-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vanta-stage5-http.log 2>&1 &

      - name: Capture Stage 5 renders
        run: node .github/scripts/stage5_capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: stage5-visual-capture
          path: artifacts/stage5
          if-no-files-found: error
          retention-days: 3
