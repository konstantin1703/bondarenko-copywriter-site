name: Tech Sheet Cleanup
on:
  push:
    paths:
      - '.qa/techsheet-cleanup.py'
      - '.github/workflows/techsheet-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Tech Sheet cleanup
        run: python .qa/techsheet-cleanup.py
      - name: Validate production files
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('v4.css').read_text(encoding='utf-8')
          assert 'ЧТО ОПРЕДЕЛЯЮТ ЭТИ ПАРАМЕТРЫ' in html
          assert 'v4.css?v=18' in html
          assert 'Tech Sheet V2 mobile grid cleanup 2026-09' in css
          assert css.count('{') == css.count('}')
          print('validation ok')
          PY
      - name: Commit production update
        run: |
          rm -f .qa/techsheet-cleanup.py .github/workflows/techsheet-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v4.css .qa/techsheet-cleanup.py .github/workflows/techsheet-cleanup.yml
          git commit -m 'fix: clean Tech Sheet mobile grid'
          git push origin HEAD:main
