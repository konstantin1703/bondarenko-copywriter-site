name: OEM divider and signature fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cssp=Path('v4.css')
          htmlp=Path('index.html')
          css=cssp.read_text()
          html=htmlp.read_text()
          marker='/* VANTA R1 — OEM divider + signature spacing fix 2026-09 */'
          if marker not in css:
              css += '''\n\n/* VANTA R1 — OEM divider + signature spacing fix 2026-09 */\n.dash{--oem-divider:rgba(126,133,128,.24)}\n.dash-stats,.modes{border:1px solid var(--oem-divider)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.012)!important}\n.dash-stats span,.modes button{border:0!important}\n.dash-stats span+span,.modes button+button{border-left:1px solid var(--oem-divider)!important}\n.modes button:last-child{border-right:0!important}\n@media(max-width:520px){\n  .signature-copy span{line-height:1.04!important;letter-spacing:-.04em!important;max-width:10ch!important}\n}\n@media(max-width:390px){\n  .signature-copy span{line-height:1.05!important;letter-spacing:-.035em!important;font-size:clamp(38px,10.4vw,48px)!important}\n}\n'''
          html=html.replace('v4.css?v=11','v4.css?v=12')
          cssp.write_text(css)
          htmlp.write_text(html)
          PY
          python3 - <<'PY'
          from pathlib import Path
          css=Path('v4.css').read_text(); html=Path('index.html').read_text()
          assert css.count('{')==css.count('}')
          assert 'v4.css?v=12' in html
          print('QA OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.css index.html
          git rm .github/workflows/oem-divider-signature-fix.yml
          git commit -m "fix: unify OEM dividers and signature spacing"
          git push
