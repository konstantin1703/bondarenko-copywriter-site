name: Locale runtime hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/locale-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve request form input references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v4-locale-v1.js')
          s=p.read_text(encoding='utf-8')
          old="  let regionInput=cloneClean('reqRegion'),cityInput=cloneClean('reqCity'),regionBox=cloneClean('regionSuggest'),cityBox=cloneClean('citySuggest');"
          new="  let regionInput=document.getElementById('reqRegion'),cityInput=document.getElementById('reqCity'),regionBox=cloneClean('regionSuggest'),cityBox=cloneClean('citySuggest');"
          if old not in s:
              raise SystemExit('locale input clone marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          i=Path('index.html')
          html=i.read_text(encoding='utf-8')
          html=html.replace('v4-locale-v1.js?v=1','v4-locale-v1.js?v=2')
          i.write_text(html,encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-locale-v1.js index.html
          git commit -m "fix: preserve request fields with localized autocomplete"
          git push
