name: Fix Tech Close iOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tech-close-ios.yml'

permissions:
  contents: write

jobs:
  build-and-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-tech-close-ios
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update permanent smoke cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/smoke_qa.mjs')
          s=p.read_text()
          s=s.replace("const cssSources=['v4.css','v4-locale-v1.css','v4-request-modal-v1.css','v4-typography-v1.css','v4-visual-v1.css'];", "const cssSources=['v4.css','v4-locale-v1.css','v4-request-modal-v1.css','v4-typography-v1.css','v4-visual-v1.css','v4-impact-v1.css'];")
          s=s.replace("v4-bundle-v1.css?v=1", "v4-bundle-v1.css?v=2")
          marker="  expectStatic(bundle.includes('Stage 4 / visual + interaction polish'),'stage 4 visual UX layer missing from bundle');\n"
          addition="  expectStatic(bundle.includes('iOS / WebKit tech-sheet close glyph'),'WebKit-safe tech close glyph missing from bundle');\n"
          if addition not in s:
              s=s.replace(marker, marker+addition)
          p.write_text(s)
          PY

      - name: Rebuild CSS bundle
        run: python3 tools/build_css_bundle.py

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vanta-fix-http.log 2>&1 &

      - name: Verify mobile WebKit close glyph
        run: |
          node --input-type=module <<'JS'
          import { webkit } from 'playwright';
          const browser=await webkit.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/?qa=webkit-close&lang=ru',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.vantaLocale);
            const trigger=page.locator('#techTrigger');
            await trigger.scrollIntoViewIfNeeded();
            await trigger.click();
            await page.waitForFunction(()=>document.getElementById('techSheet')?.open===true);
            const state=await page.evaluate(()=>{
              const b=document.getElementById('techClose');
              const before=getComputedStyle(b,'::before');
              const after=getComputedStyle(b,'::after');
              const r=b.getBoundingClientRect();
              return {
                width:r.width,height:r.height,
                beforeContent:before.content,afterContent:after.content,
                beforeDisplay:before.display,afterDisplay:after.display,
                beforeWidth:parseFloat(before.width),afterWidth:parseFloat(after.width),
                beforeBg:before.backgroundColor,afterBg:after.backgroundColor
              };
            });
            console.log(JSON.stringify(state));
            if(state.width<44||state.height<44)throw new Error('Close target below 44px');
            if(state.beforeDisplay==='none'||state.afterDisplay==='none')throw new Error('Close glyph pseudo element hidden');
            if(state.beforeWidth<17||state.afterWidth<17)throw new Error('Close glyph line too small');
            if(state.beforeBg==='rgba(0, 0, 0, 0)'||state.afterBg==='rgba(0, 0, 0, 0)')throw new Error('Close glyph transparent');
            if(errors.length)throw new Error(`Runtime errors: ${errors.join(' | ')}`);
            await page.screenshot({path:'/tmp/tech-close-webkit.png'});
            await page.locator('#techClose').click();
            await page.waitForFunction(()=>document.getElementById('techSheet')?.open!==true);
          } finally { await browser.close(); }
          JS

      - name: Commit generated fix branch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-bundle-v1.css index.html .github/scripts/smoke_qa.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build: integrate WebKit tech close fix"
            git push origin HEAD:fix-tech-close-ios
          fi

      - name: Upload WebKit proof
        uses: actions/upload-artifact@v4
        with:
          name: tech-close-webkit
          path: /tmp/tech-close-webkit.png
          if-no-files-found: error
          retention-days: 3
