name: Product Flow V4 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-flow-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V4 product flow QA
        run: python tools/apply_product_flow_v4.py
      - name: Commit production update
        run: |
          rm -f .github/workflows/product-flow-v4.yml tools/apply_product_flow_v4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete configurator request and typography qa'
          git push
