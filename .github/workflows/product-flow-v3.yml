name: Product Flow V3

on:
  push:
    paths:
      - '.github/workflows/product-flow-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Product Flow V3
        run: python .qa/product-flow-v3.py
      - name: Validate production files
        run: |
          node --check v4.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('v4.css').read_text(encoding='utf-8')
          js=Path('v4.js').read_text(encoding='utf-8')
          ids=re.findall(r'\bid="([^"]+)"',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'v4.css?v=21' in html and 'v4.js?v=13' in html
          assert 'ИНЖЕНЕРНЫЙ<br/>ПРОФИЛЬ R1' in html
          assert 'configActiveModules' in html and 'configCharacter' in html
          assert 'request-complete[hidden]' in css
          assert 'Product Flow V3' in css and 'Configurator V3 + Request V2' in js
          req=html[html.index('<section class="request chapter"'):html.index('<section class="activate chapter"')]
          for bad in ('демонстрацион', 'portfolio', 'DEMO ONLY', 'ничего не отправ'):
              assert bad.lower() not in req.lower(), f'request contains forbidden copy: {bad}'
          assert css.count('{') == css.count('}'), 'CSS braces mismatch'
          print('validation ok')
          PY
      - name: Commit production update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .qa/product-flow-v3.py .github/workflows/product-flow-v3.yml
          git add index.html v4.css v4.js
          git commit -m 'feat: redesign engineering profile configurator and request flow'
          git push origin HEAD:main
