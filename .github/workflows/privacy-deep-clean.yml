name: Privacy deep clean v2

on:
  push:
    paths:
      - ".github/workflows/privacy-deep-clean.yml"

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize every readable file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          skip={'.git','node_modules'}
          names=['Константин Бондаренко','Бондаренко Константин','КОНСТАНТИН БОНДАРЕНКО','БОНДАРЕНКО КОНСТАНТИН']
          exact=['byxapckuu@gmail.com','privacy-removed@example.invalid','+79912810796','79912810796','+7 (991) 281-07-96','+7(991)281-07-96','+7 (000) 000-00-00','+70000000000','https://t.me/whity14','http://t.me/whity14','t.me/whity14','@whity14','whity14']
          anchor=re.compile(r'<a\b(?=[^>]*(?:href=["\'](?:mailto:|tel:|https?://t\.me/whity14)[^"\']*["\']|data-contact=["\'](?:email|phone)["\']))[^>]*>.*?</a>',re.I|re.S)
          personal_line=re.compile(r'^.*(?:byxapckuu@gmail\.com|privacy-removed@example\.invalid|\+7\s*\(?991\)?[\s\-]*281[\s\-]*07[\s\-]*96|79912810796|t\.me/whity14|@whity14).*$' ,re.I|re.M)
          structured=re.compile(r'^\s*["\']?(?:email|telephone|phone)["\']?\s*[:=].*$',re.I|re.M)
          changed=[]
          for p in root.rglob('*'):
            if not p.is_file() or any(x in skip for x in p.parts): continue
            try:
              if p.stat().st_size > 8_000_000: continue
              s=p.read_text(encoding='utf-8')
            except Exception: continue
            o=s
            s=anchor.sub('',s)
            s=personal_line.sub('',s)
            s=structured.sub('',s)
            for x in names: s=s.replace(x,'Автор')
            for x in exact: s=s.replace(x,'')
            s=s.replace('leads-inbox.byxapckuu.workers.dev','removed-endpoint.invalid')
            s=s.replace('byxapckuu','removed')
            s=re.sub(r'\n{4,}','\n\n\n',s)
            if s!=o:
              p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('changed_files='+str(len(changed)))
          PY

      - name: Audit all readable files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          pats=[re.compile(r'Константин\s+Бондаренко',re.I),re.compile(r'Бондаренко\s+Константин',re.I),re.compile(r'byxapckuu',re.I),re.compile(r'\+7\s*\(?991\)?[\s\-]*281[\s\-]*07[\s\-]*96'),re.compile(r'79912810796'),re.compile(r't\.me/whity14',re.I),re.compile(r'@whity14',re.I),re.compile(r'\bwhity14\b',re.I)]
          hits=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts: continue
            try:
              if p.stat().st_size > 8_000_000: continue
              s=p.read_text(encoding='utf-8')
            except Exception: continue
            if any(x.search(s) for x in pats): hits.append(str(p))
          print('forbidden_hits='+str(len(hits)))
          if hits:
            print('\n'.join(hits[:200])); sys.exit(1)
          PY

      - name: Commit clean current tree and publish clean root branch
        shell: bash
        run: |
          git config user.name "privacy-cleanup"
          git config user.email "privacy-cleanup@users.noreply.github.com"
          rm -f .github/workflows/privacy-deep-clean.yml
          git add -A
          git commit -m "Remove all personal identifiers" || true
          git push origin HEAD:main
          git checkout --orphan privacy-clean-root
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -A
          git commit -m "Privacy-clean repository snapshot"
          git push --force origin privacy-clean-root:privacy-clean-root
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep '^origin/' | grep -v '^origin/main$' | grep -v '^origin/privacy-clean-root$' | grep -v '^origin/HEAD$' || true); do
            git push origin --delete "${ref#origin/}" || true
          done
          for t in $(git tag -l); do git push origin --delete "$t" || true; done
