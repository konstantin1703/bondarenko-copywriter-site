name: Add canonical tags (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Insert canonical tags
        run: |
          BASE="https://konstantin1703.github.io/bondarenko-copywriter-site"

          declare -A FILES
          FILES=(
            ["blog/content-strategy-tips.html"]="${BASE}/blog/content-strategy-tips.html"
            ["blog/copywriting-mistakes.html"]="${BASE}/blog/copywriting-mistakes.html"
            ["blog/how-to-write-landing-copy.html"]="${BASE}/blog/how-to-write-landing-copy.html"
            ["portfolio/example-1-landing-text.html"]="${BASE}/portfolio/example-1-landing-text.html"
            ["portfolio/example-2-article.html"]="${BASE}/portfolio/example-2-article.html"
            ["portfolio/example-3-social-posts.html"]="${BASE}/portfolio/example-3-social-posts.html"
          )

          for f in "${!FILES[@]}"; do
            url="${FILES[$f]}"
            if ! grep -q 'rel="canonical"' "$f"; then
              sed -i "s|</head>|    <link rel=\"canonical\" href=\"${url}\">\n</head>|" "$f"
              echo "Patched: $f"
            else
              echo "Already has canonical: $f - skipped"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/content-strategy-tips.html \
                  blog/copywriting-mistakes.html \
                  blog/how-to-write-landing-copy.html \
                  portfolio/example-1-landing-text.html \
                  portfolio/example-2-article.html \
                  portfolio/example-3-social-posts.html
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "seo: add canonical tags to blog and portfolio pages"
          git push
