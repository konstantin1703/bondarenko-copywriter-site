name: Tech close and speed alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          cat .qa/techclose-speed.css >> v4.css
          sed -i 's/v4.css?v=14/v4.css?v=15/g' index.html
          python3 - <<'PY'
          from pathlib import Path
          css=Path('v4.css').read_text()
          html=Path('index.html').read_text()
          assert css.count('{') == css.count('}')
          assert 'shared close control + mobile speed alignment' in css
          assert 'v4.css?v=15' in html
          print('QA OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.css index.html
          git rm .qa/techclose-speed.css .github/workflows/techclose-speed-align.yml
          git commit -m "fix: unify close controls and align mobile speed readout"
          git push