name: Stage 3 CSS Consolidation Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage3-runner-temp.yml'

permissions:
  contents: write

concurrency:
  group: stage3-css-consolidation-runner
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout stage 3 branch
        uses: actions/checkout@v4
        with:
          ref: stage3-css-consolidation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare candidate bundle
        run: |
          rm -rf /tmp/vanta-stage3-candidate
          cp -a "$GITHUB_WORKSPACE" /tmp/vanta-stage3-candidate
          rm -rf /tmp/vanta-stage3-candidate/.git
          python3 /tmp/vanta-stage3-candidate/tools/build_css_bundle.py
          grep -q 'v4-bundle-v1.css?v=1' /tmp/vanta-stage3-candidate/index.html
          test -s /tmp/vanta-stage3-candidate/v4-bundle-v1.css

      - name: Install visual-regression dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Start baseline and candidate servers
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" > /tmp/vanta-stage3-baseline.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/vanta-stage3-candidate > /tmp/vanta-stage3-candidate.log 2>&1 &

      - name: Verify visual equivalence
        env:
          BASELINE_URL: http://127.0.0.1:4173
          CANDIDATE_URL: http://127.0.0.1:4174
        run: node .github/scripts/stage3_visual_compare.mjs

      - name: Publish generated bundle to stage 3 branch
        run: |
          cp /tmp/vanta-stage3-candidate/v4-bundle-v1.css "$GITHUB_WORKSPACE/v4-bundle-v1.css"
          cp /tmp/vanta-stage3-candidate/index.html "$GITHUB_WORKSPACE/index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v4-bundle-v1.css
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'refactor: activate consolidated CSS bundle'
            git push origin HEAD:stage3-css-consolidation
          fi
