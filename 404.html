<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница не найдена | Автор</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #F8FAFC;
            --bg-white: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --border: #E5E7EB;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            height: 80px;
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 18px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .error-wrap {
            text-align: center;
            max-width: 480px;
        }

        .error-code {
            font-size: 96px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .error-text {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        footer {
            background-color: #1F2937;
            color: #9CA3AF;
            font-size: 13px;
            padding: 24px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="/" class="logo">
            <div class="logo-mark">Kb</div>
            <div>Автор</div>
        </a>
    </div>
</header>

<main>
    <div class="error-wrap">
        <div class="error-code">404</div>
        <h1 class="error-title">Страница не найдена</h1>
        <p class="error-text">
            Возможно, страница была удалена или вы перешли по неверной ссылке.
        </p>
        <a href="/" class="btn btn-primary">← Вернуться на главную</a>
    </div>
</main>

<footer>
    © 2026 · Автор
</footer>

</body>
</html>
