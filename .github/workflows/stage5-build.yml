name: Stage 5 Bundle Build

on:
  push:
    branches: [stage5-portfolio-impact]
    paths:
      - 'v4-impact-v1.css'
      - 'tools/build_css_bundle.py'
      - '.github/workflows/stage5-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage5-portfolio-impact

      - name: Rebuild consolidated CSS
        run: python3 tools/build_css_bundle.py

      - name: Commit generated bundle
        run: |
          if git diff --quiet -- v4-bundle-v1.css index.html; then
            echo "Bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-bundle-v1.css index.html
          git commit -m "build: regenerate CSS bundle for stage 5"
          git push origin HEAD:stage5-portfolio-impact
