name: Stage 6 Art Direction QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage6-art-direction-qa.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Stage 6 branch
        uses: actions/checkout@v4
        with:
          ref: stage6-art-direction
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extend permanent smoke for Stage 6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/smoke_qa.mjs')
          s=p.read_text()
          s=s.replace("'v4-visual-v1.css','v4-impact-v1.css'];", "'v4-visual-v1.css','v4-impact-v1.css','v4-artdirection-v1.css'];")
          s=s.replace("v4-bundle-v1.css?v=2", "v4-bundle-v1.css?v=3")
          marker="  expectStatic(bundle.includes('iOS / WebKit tech-sheet close glyph'),'WebKit-safe tech close glyph missing from bundle');\n"
          addition="  expectStatic(bundle.includes('Stage 6 / premium composition pass'),'stage 6 art-direction layer missing from bundle');\n"
          if addition not in s:
              s=s.replace(marker, marker+addition)
          p.write_text(s)
          PY

      - name: Build CSS bundle
        run: python3 tools/build_css_bundle.py

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vanta-stage6-http.log 2>&1 &

      - name: Permanent smoke QA
        run: node .github/scripts/smoke_qa.mjs

      - name: Verify and capture Stage 6 composition
        run: |
          mkdir -p /tmp/stage6-proof
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const cfg of [
              {name:'desktop',width:1440,height:1100,isMobile:false},
              {name:'mobile',width:390,height:844,isMobile:true}
            ]){
              const page=await browser.newPage({viewport:{width:cfg.width,height:cfg.height},isMobile:cfg.isMobile,hasTouch:cfg.isMobile,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await page.goto('http://127.0.0.1:4173/?qa=stage6&lang=ru',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForFunction(()=>window.vantaLocale);
              await page.screenshot({path:`/tmp/stage6-proof/${cfg.name}-landing.png`,fullPage:true});
              const trigger=page.locator('#techTrigger');
              await trigger.scrollIntoViewIfNeeded();
              await trigger.click();
              await page.waitForFunction(()=>document.getElementById('techSheet')?.open===true);
              const state=await page.evaluate(()=>{
                const sheet=document.getElementById('techSheet');
                const close=document.getElementById('techClose');
                const title=document.querySelector('#techSheet .tech-sheet-titleblock h2');
                const value=document.querySelector('#techSheet .tech-profile-value strong');
                const group=document.querySelector('#techSheet .tech-profile-group');
                const before=getComputedStyle(close,'::before');
                return {
                  overflow:(sheet?.scrollWidth||0)-(sheet?.clientWidth||0),
                  closeWidth:close?.getBoundingClientRect().width||0,
                  glyphDisplay:before.display,
                  glyphWidth:parseFloat(before.width)||0,
                  titleSize:title?parseFloat(getComputedStyle(title).fontSize):0,
                  valueSize:value?parseFloat(getComputedStyle(value).fontSize):0,
                  groupDisplay:group?getComputedStyle(group).display:''
                };
              });
              console.log(cfg.name,JSON.stringify(state));
              if(state.overflow>3)throw new Error(`${cfg.name}: engineering profile overflow ${state.overflow}px`);
              if(state.closeWidth<44||state.glyphDisplay==='none'||state.glyphWidth<17)throw new Error(`${cfg.name}: close control regressed`);
              if(cfg.isMobile){
                if(state.titleSize<48||state.valueSize<72)throw new Error(`${cfg.name}: Stage 6 type scale below floor`);
              }else{
                if(state.titleSize<58||state.valueSize<76||state.groupDisplay!=='grid')throw new Error(`${cfg.name}: Stage 6 editorial layout below floor`);
              }
              await page.waitForTimeout(100);
              await page.screenshot({path:`/tmp/stage6-proof/${cfg.name}-tech-top.png`,fullPage:false});
              await page.locator('#techSheet .tech-profile-group:nth-child(2)').scrollIntoViewIfNeeded();
              await page.waitForTimeout(80);
              await page.screenshot({path:`/tmp/stage6-proof/${cfg.name}-tech-energy.png`,fullPage:false});
              await page.locator('#techSheet .tech-profile-group:nth-child(3)').scrollIntoViewIfNeeded();
              await page.waitForTimeout(80);
              await page.screenshot({path:`/tmp/stage6-proof/${cfg.name}-tech-vehicle.png`,fullPage:false});
              if(errors.length)throw new Error(`${cfg.name}: ${errors.join(' | ')}`);
              await page.close();
            }
          } finally {
            await browser.close();
          }
          JS

      - name: Commit generated branch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4-bundle-v1.css index.html .github/scripts/smoke_qa.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build: integrate stage 6 art direction"
            git push origin HEAD:stage6-art-direction
          fi

      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: stage6-art-direction-proof
          path: /tmp/stage6-proof
          if-no-files-found: error
          retention-days: 3
