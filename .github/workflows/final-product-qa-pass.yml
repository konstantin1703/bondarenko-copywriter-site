name: Final product QA pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final product pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path=Path('v4.css')
          js_path=Path('v4.js')
          html_path=Path('index.html')
          hotfix_path=Path('v4-hotfix-mobile.css')
          css_payload=Path('.qa/final-pass.css')
          js_payload=Path('.qa/final-pass.js')

          css=css_path.read_text()
          js=js_path.read_text()
          html=html_path.read_text()

          merge_marker='/* VANTA R1 — merged mobile/signature hotfix 2026-09 */'
          if hotfix_path.exists() and merge_marker not in css:
              hotfix=hotfix_path.read_text().replace('/* linker trigger */','').strip()
              css += '\n\n' + merge_marker + '\n' + hotfix + '\n'

          css_extra=css_payload.read_text().strip()
          if css_extra and css_extra.splitlines()[0] not in css:
              css += '\n\n' + css_extra + '\n'

          js_extra=js_payload.read_text().strip()
          if js_extra and js_extra.splitlines()[0] not in js:
              js += '\n\n' + js_extra + '\n'

          html=html.replace('<link href="v4.css?v=10" rel="stylesheet"/><link href="v4-hotfix-mobile.css?v=1" rel="stylesheet"/>','<link href="v4.css?v=11" rel="stylesheet"/>')
          html=html.replace('<script defer src="v4.js?v=8"></script>','<script defer src="v4.js?v=9"></script>')

          css_path.write_text(css)
          js_path.write_text(js)
          html_path.write_text(html)
          if hotfix_path.exists(): hotfix_path.unlink()
          PY

          node --check v4.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          css=Path('v4.css').read_text()
          ids=re.findall(r'\bid="([^"]+)"',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          anchors=re.findall(r'href="#([^"]+)"',html)
          missing=sorted({a for a in anchors if a!='top' and f'id="{a}"' not in html})
          assert not dup, f'duplicate ids: {dup}'
          assert not missing, f'missing anchors: {missing}'
          assert css.count('{')==css.count('}'), 'CSS brace mismatch'
          assert 'v4-hotfix-mobile.css' not in html, 'hotfix stylesheet still linked'
          assert not Path('v4-hotfix-mobile.css').exists(), 'hotfix file still exists'
          assert 'v4.css?v=11' in html and 'v4.js?v=9' in html, 'cache-bust missing'
          print('QA OK',len(ids),'ids',css.count('{'),'css blocks')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm --ignore-unmatch .github/workflows/final-product-qa-pass.yml .qa/final-pass.css .qa/final-pass.js
          git commit -m "feat: finalize mobile, gallery and hero polish"
          git push
