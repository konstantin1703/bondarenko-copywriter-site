name: Gallery focus and OEM divider fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cssp=Path('v4.css')
          htmlp=Path('index.html')
          css=cssp.read_text()
          html=htmlp.read_text()
          marker='/* VANTA R1 — gallery focus + exact OEM divider geometry 2026-09 */'
          if marker not in css:
              css += '''\n\n/* VANTA R1 — gallery focus + exact OEM divider geometry 2026-09 */\n.dash-stats,.modes{position:relative}\n.dash-stats span+span,.modes button+button{border-left:0!important}\n.dash-stats::before,.dash-stats::after,.modes::before,.modes::after{content:\"\";position:absolute;z-index:4;top:0;bottom:0;width:1px;background:var(--oem-divider);pointer-events:none}\n.dash-stats::before,.modes::before{left:33.333333%}\n.dash-stats::after,.modes::after{left:66.666667%}\n.rail{outline:none!important;-webkit-tap-highlight-color:transparent}\n.rail:focus{outline:none!important}\n@media(hover:hover) and (pointer:fine){.rail:focus-visible{box-shadow:0 0 0 1px rgba(255,255,255,.22);outline:none!important}}\n'''
          html=html.replace('v4.css?v=12','v4.css?v=13')
          cssp.write_text(css)
          htmlp.write_text(html)
          PY
          python3 - <<'PY'
          from pathlib import Path
          css=Path('v4.css').read_text(); html=Path('index.html').read_text()
          assert css.count('{')==css.count('}')
          assert 'v4.css?v=13' in html
          print('QA OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.css index.html
          git rm .github/workflows/gallery-focus-divider-fix.yml
          git commit -m "fix: align OEM dividers and remove gallery tap outline"
          git push
