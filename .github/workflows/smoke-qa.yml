name: Frontend Smoke QA

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'tools/build_css_bundle.py'
      - '.github/scripts/smoke_qa.mjs'
      - '.github/workflows/smoke-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'data/**'
      - 'tools/build_css_bundle.py'
      - '.github/scripts/smoke_qa.mjs'
      - '.github/workflows/smoke-qa.yml'

permissions:
  contents: read

concurrency:
  group: frontend-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check v4.js
          node --check v4-locale-v1.js
          node --check v4-request-modal-v1.js
          node --check .github/scripts/smoke_qa.mjs

      - name: CSS bundle source integrity
        run: |
          python3 tools/build_css_bundle.py
          git diff --exit-code -- v4-bundle-v1.css index.html

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vanta-http.log 2>&1 &
          echo $! > /tmp/vanta-http.pid

      - name: Run smoke QA
        run: node .github/scripts/smoke_qa.mjs
