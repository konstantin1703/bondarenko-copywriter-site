name: VANTA premium motion pass

on:
  push:
    paths:
      - '.github/workflows/motion-pass.yml'

permissions:
  contents: write

jobs:
  motion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/motion.part00 tools/motion.part01 tools/motion.part02 tools/motion.part03 tools/motion.part04 tools/motion.part05 > /tmp/motion.b64
          base64 -d /tmp/motion.b64 > /tmp/motion.tgz
          echo "c0fd82bba130ffa544c784a65e4356429329de84f70e63158778dcfbc7c3962d  /tmp/motion.tgz" | sha256sum -c -
          tar -xzf /tmp/motion.tgz -C .

      - name: Validate motion build
        shell: bash
        run: |
          set -euo pipefail
          node --check v4.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('v4.css').read_text(encoding='utf-8')
          js = Path('v4.js').read_text(encoding='utf-8')

          assert 'v4.css?v=6' in html
          assert 'v4.js?v=5' in html
          assert css.count('{') == css.count('}')
          assert '@property --dial' in css
          assert 'prefers-reduced-motion:reduce' in css
          assert 'SYSTEM CHECK' in js and 'stage-ready' in js
          assert 'has-interacted' in js
          assert 'role="button"' in html and 'data-call="0"' in html
          assert 'aria-busy="false"' in html
          assert 'console.log' not in js and 'debugger' not in js

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.hrefs = []
                  self.images = 0
                  self.missing_alt = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a:
                      self.ids.append(a['id'])
                  if tag == 'a' and a.get('href', '').startswith('#'):
                      self.hrefs.append(a['href'][1:])
                  if tag == 'img':
                      self.images += 1
                      if 'alt' not in a:
                          self.missing_alt += 1

          audit = Audit()
          audit.feed(html)
          assert len(audit.ids) == len(set(audit.ids))
          assert all(not target or target in set(audit.ids) for target in audit.hrefs)
          assert audit.images == 15 and audit.missing_alt == 0
          print('Premium motion static validation: OK')
          PY

      - name: Commit motion pass to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/motion.part0* .github/workflows/motion-pass.yml
          rmdir tools 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: premium motion and interaction pass'
          git push origin HEAD:main
