name: VANTA premium product pass
on:
  push:
    paths:
      - '.github/workflows/premium-product-pass.yml'
permissions:
  contents: write
jobs:
  premium-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply premium product pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          css = Path('v4.css')
          js = Path('v4.js')

          html = index.read_text()
          styles = css.read_text()
          script = js.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one block for {label}, found {text.count(old)}')
              return text.replace(old, new, 1)

          # Cache busts.
          html = replace_once(html, 'v4.css?v=8', 'v4.css?v=9', 'css version')
          html = replace_once(html, 'v4.js?v=6', 'v4.js?v=7', 'js version')

          # Premium gallery toolbar with count + progress.
          old_gallery_head = '<div class="gallery-head reveal"><div><div class="eyebrow">05 / ГАЛЕРЕЯ / ХАРАКТЕР</div><h2>Один R1.<br/><em>Шесть граней характера.</em></h2></div><div class="gallery-controls"><button aria-label="Предыдущий кадр" id="prev">←</button><button aria-label="Следующий кадр" id="next">→</button></div></div>'
          new_gallery_head = '<div class="gallery-head reveal"><div><div class="eyebrow">05 / ГАЛЕРЕЯ / ХАРАКТЕР</div><h2>Один R1.<br/><em>Шесть граней характера.</em></h2></div><div class="gallery-toolbar"><div aria-live="polite" class="gallery-meta"><span id="galleryCounter">01 / 06</span><i aria-hidden="true"><b id="galleryProgress"></b></i></div><div class="gallery-controls"><button aria-label="Предыдущий кадр" id="prev">←</button><button aria-label="Следующий кадр" id="next">→</button></div></div></div>'
          html = replace_once(html, old_gallery_head, new_gallery_head, 'gallery toolbar')

          # Activation becomes a restrained mini configurator.
          old_swatches = '<div aria-label="Цветовой режим" class="swatches"><button aria-label="Красная подсветка" aria-pressed="true" class="sw active" data-color="red"></button><button aria-label="Зелёная подсветка" aria-pressed="false" class="sw" data-color="green"></button><button aria-label="Stealth Black" aria-pressed="false" class="sw" data-color="stealth"></button></div>'
          new_swatches = '<div aria-label="Цветовой режим" class="swatches"><button aria-label="Красная подсветка" aria-pressed="true" class="sw active" data-color="red"></button><button aria-label="Зелёная подсветка" aria-pressed="false" class="sw" data-color="green"></button><button aria-label="Stealth Black" aria-pressed="false" class="sw" data-color="stealth"></button></div><div aria-live="polite" class="activation-config"><small>CONFIG / LIGHT SIGNATURE</small><strong id="finishName">SIGNAL RED</strong><span id="finishDesc">Фирменная красная световая подпись.</span></div>'
          html = replace_once(html, old_swatches, new_swatches, 'activation configurator')
          index.write_text(html)

          # Replace gallery controller as one cohesive block.
          gallery_start = script.index('  // Gallery: centered frame becomes the visual anchor; keyboard arrows mirror buttons.')
          gallery_end = script.index('  // Ride System — one state model, animated speed and calibrated visual settle.')
          new_gallery_js = '''  // Gallery — premium product rail: exact frame snapping, counter/progress and desktop drag.\n  const rail=document.getElementById('rail');\n  const galleryFrames=[...(rail?.querySelectorAll('figure')||[])];\n  const galleryCounter=document.getElementById('galleryCounter');\n  const galleryProgress=document.getElementById('galleryProgress');\n  const prevButton=document.getElementById('prev');\n  const nextButton=document.getElementById('next');\n  let galleryRaf=0;\n  let galleryIndex=0;\n  const setGalleryActive=index=>{\n    if(!galleryFrames.length)return;\n    galleryIndex=Math.max(0,Math.min(index,galleryFrames.length-1));\n    galleryFrames.forEach((frame,i)=>{\n      const active=i===galleryIndex;\n      frame.classList.toggle('is-active',active);\n      frame.setAttribute('aria-current',active?'true':'false');\n    });\n    if(galleryCounter)galleryCounter.textContent=`${String(galleryIndex+1).padStart(2,'0')} / ${String(galleryFrames.length).padStart(2,'0')}`;\n    if(galleryProgress)galleryProgress.style.width=`${((galleryIndex+1)/galleryFrames.length)*100}%`;\n    if(prevButton)prevButton.disabled=galleryIndex===0;\n    if(nextButton)nextButton.disabled=galleryIndex===galleryFrames.length-1;\n  };\n  const closestGalleryIndex=()=>{\n    if(!rail||!galleryFrames.length)return 0;\n    const railRect=rail.getBoundingClientRect();\n    const center=railRect.left+railRect.width/2;\n    let active=0,best=Infinity;\n    galleryFrames.forEach((frame,i)=>{\n      const r=frame.getBoundingClientRect();\n      const d=Math.abs((r.left+r.width/2)-center);\n      if(d<best){best=d;active=i;}\n    });\n    return active;\n  };\n  const updateGalleryActive=()=>{galleryRaf=0;setGalleryActive(closestGalleryIndex());};\n  const requestGalleryUpdate=()=>{if(!galleryRaf)galleryRaf=requestAnimationFrame(updateGalleryActive);};\n  const scrollGalleryTo=index=>{\n    if(!rail||!galleryFrames.length)return;\n    const target=Math.max(0,Math.min(index,galleryFrames.length-1));\n    const frame=galleryFrames[target];\n    const left=frame.offsetLeft-(rail.clientWidth-frame.offsetWidth)/2;\n    rail.scrollTo({left,behavior:reduceMotion?'auto':'smooth'});\n    setGalleryActive(target);\n  };\n  prevButton?.addEventListener('click',()=>scrollGalleryTo(galleryIndex-1));\n  nextButton?.addEventListener('click',()=>scrollGalleryTo(galleryIndex+1));\n  rail?.addEventListener('scroll',requestGalleryUpdate,{passive:true});\n  rail?.addEventListener('keydown',e=>{\n    if(e.key==='ArrowLeft'){e.preventDefault();scrollGalleryTo(galleryIndex-1);}\n    if(e.key==='ArrowRight'){e.preventDefault();scrollGalleryTo(galleryIndex+1);}\n    if(e.key==='Home'){e.preventDefault();scrollGalleryTo(0);}\n    if(e.key==='End'){e.preventDefault();scrollGalleryTo(galleryFrames.length-1);}\n  });\n  addEventListener('resize',requestGalleryUpdate,{passive:true});\n  if(rail&&finePointer){\n    let dragging=false,startX=0,startScroll=0,moved=false;\n    rail.addEventListener('pointerdown',e=>{\n      if(e.button!==0)return;\n      dragging=true;moved=false;startX=e.clientX;startScroll=rail.scrollLeft;\n      rail.classList.add('is-dragging');rail.setPointerCapture?.(e.pointerId);\n    });\n    rail.addEventListener('pointermove',e=>{\n      if(!dragging)return;\n      const dx=e.clientX-startX;\n      if(Math.abs(dx)>3)moved=true;\n      rail.scrollLeft=startScroll-dx;\n    });\n    const endDrag=e=>{\n      if(!dragging)return;\n      dragging=false;rail.classList.remove('is-dragging');rail.releasePointerCapture?.(e.pointerId);\n      if(moved)scrollGalleryTo(closestGalleryIndex());\n    };\n    rail.addEventListener('pointerup',endDrag);\n    rail.addEventListener('pointercancel',endDrag);\n  }\n  setGalleryActive(0);\n\n'''
          script = script[:gallery_start] + new_gallery_js + script[gallery_end:]

          # Active section navigation, integrated into the existing scroll loop.
          old_scroll = "    header?.classList.toggle('scrolled',y>18);\n    if(progress) progress.style.transform=`scaleX(${Math.min(y/max,1)})`;"
          new_scroll = "    header?.classList.toggle('scrolled',y>18);\n    if(progress) progress.style.transform=`scaleX(${Math.min(y/max,1)})`;\n    if(navSections.length){\n      const probe=y+innerHeight*.34;\n      let current='';\n      navSections.forEach(section=>{if(section.offsetTop<=probe)current=section.id;});\n      navAnchors.forEach(link=>link.classList.toggle('is-current',link.getAttribute('href')===`#${current}`));\n    }"
          # Declarations must exist before updateScroll first runs.
          decl_old = "  let lastFocus=null;\n  let scrollTick=false;"
          decl_new = "  let lastFocus=null;\n  let scrollTick=false;\n  const navAnchors=[...document.querySelectorAll('.desktop-nav a,.activate-link,.mobile-menu a')];\n  const navSections=[...document.querySelectorAll('main section[id]')];"
          script = replace_once(script, decl_old, decl_new, 'nav declarations')
          script = replace_once(script, old_scroll, new_scroll, 'active navigation')

          # Activation configurator data and behavior.
          activation_decl_old = "  const activateLabel=activateBtn?.querySelector('span');\n  let activationOn=false;"
          activation_decl_new = "  const activateLabel=activateBtn?.querySelector('span');\n  const finishName=document.getElementById('finishName');\n  const finishDesc=document.getElementById('finishDesc');\n  const finishes={\n    red:{name:'SIGNAL RED',desc:'Фирменная красная световая подпись.'},\n    green:{name:'VOLT GREEN',desc:'Холодный электрический зелёный акцент.'},\n    stealth:{name:'STEALTH BLACK',desc:'Монохромный световой режим без лишнего блеска.'}\n  };\n  let currentFinish='red';\n  let activationOn=false;"
          script = replace_once(script, activation_decl_old, activation_decl_new, 'activation config declarations')

          note_old = "    if(note)note.textContent=on?'Оптика и бортовая система активированы. Можно менять цветовой режим.':'Система ожидает запуска.';"
          note_new = "    if(note)note.textContent=on?`${finishes[currentFinish].name}: оптика и бортовая система активированы.`:'Система ожидает запуска.';"
          script = replace_once(script, note_old, note_new, 'activation note')

          old_swatch_js = "  document.querySelectorAll('.sw').forEach(sw=>sw.addEventListener('click',()=>{\n    document.querySelectorAll('.sw').forEach(x=>{\n      const active=x===sw;\n      x.classList.toggle('active',active);\n      x.setAttribute('aria-pressed',String(active));\n    });\n    stage?.classList.remove('color-green','color-stealth');\n    if(sw.dataset.color==='green')stage?.classList.add('color-green');\n    if(sw.dataset.color==='stealth')stage?.classList.add('color-stealth');\n  }));"
          new_swatch_js = "  const applyFinish=(key,{announce=true}={})=>{\n    const finish=finishes[key]||finishes.red;\n    currentFinish=finishes[key]?key:'red';\n    document.querySelectorAll('.sw').forEach(x=>{\n      const active=x.dataset.color===currentFinish;\n      x.classList.toggle('active',active);\n      x.setAttribute('aria-pressed',String(active));\n    });\n    stage?.classList.remove('color-green','color-stealth','color-shifting');\n    if(currentFinish==='green')stage?.classList.add('color-green');\n    if(currentFinish==='stealth')stage?.classList.add('color-stealth');\n    if(!reduceMotion){void stage?.offsetWidth;stage?.classList.add('color-shifting');setTimeout(()=>stage?.classList.remove('color-shifting'),420);}\n    if(finishName)finishName.textContent=finish.name;\n    if(finishDesc)finishDesc.textContent=finish.desc;\n    if(announce&&note)note.textContent=activationOn?`${finish.name}: световой характер обновлён.`:'Выбран световой характер. Система ожидает запуска.';\n  };\n  document.querySelectorAll('.sw').forEach(sw=>sw.addEventListener('click',()=>applyFinish(sw.dataset.color)));\n  applyFinish('red',{announce:false});"
          script = replace_once(script, old_swatch_js, new_swatch_js, 'activation swatches')
          js.write_text(script)

          # Final product-level CSS. Intentionally one cohesive override layer within the single production CSS.
          marker = '/* VANTA R1 — Premium Product Pass 2026-09 */'
          if marker in styles:
              raise SystemExit('premium product pass already exists')
          premium_css = r'''

/* VANTA R1 — Premium Product Pass 2026-09 */
/* Navigation: quiet current-section orientation. */
.desktop-nav a,.activate-link,.mobile-menu a{position:relative}
.desktop-nav a:after,.activate-link:after{content:"";position:absolute;left:0;right:100%;bottom:-8px;height:1px;background:var(--accent);transition:right .3s var(--motion-ease),opacity .3s ease;opacity:.3}
.desktop-nav a.is-current,.activate-link.is-current{color:#f2f2ee}
.desktop-nav a.is-current:after,.activate-link.is-current:after{right:0;opacity:.9}
.mobile-menu a.is-current{color:#fff}
.mobile-menu a.is-current:before{content:"";display:inline-block;width:16px;height:1px;margin:0 10px 8px 0;background:var(--accent)}

/* Gallery: product-showcase framing, exact snap, counter and progress. */
.gallery-toolbar{display:flex;align-items:center;gap:18px}
.gallery-meta{width:132px;display:grid;gap:9px;justify-items:end;font-variant-numeric:tabular-nums}
.gallery-meta>span{font-size:9px;letter-spacing:.16em;color:#a3a39f}
.gallery-meta>i{display:block;width:100%;height:1px;background:#252525;overflow:hidden}
.gallery-meta>i>b{display:block;width:16.666%;height:100%;background:linear-gradient(90deg,#8e1d17,var(--accent));box-shadow:0 0 8px rgba(255,46,27,.24);transition:width .42s var(--motion-ease)}
.gallery-controls button:disabled{opacity:.24;cursor:default;pointer-events:none}
.rail{scroll-snap-type:x mandatory;scroll-padding-inline:7vw;cursor:grab;padding-left:2px;padding-right:7vw}
.rail.is-dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}
.rail figure{min-width:min(66vw,820px);scroll-snap-align:center;opacity:.5;transform:scale(.968);border-color:#1f1f1e}
.rail figure.is-active{opacity:1;transform:scale(1);border-color:#42423f;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.rail figure.is-active img{filter:brightness(1.025) saturate(1)}
.rail figure:not(.is-active) img{filter:brightness(.72) saturate(.78)}
.rail figcaption{border-top:1px solid #222;background:linear-gradient(180deg,#0a0a0a,#070707)}

/* Ride System: stricter OEM lower deck; SVG dial stays the single hero instrument. */
.dash-screen{background-image:none!important}
.dash-main{gap:18px}
.mode-readout{padding-bottom:14px}
.mode-readout strong{font-weight:500;text-shadow:none}
.dash-stats{border-radius:10px;background:rgba(255,255,255,.006);box-shadow:inset 0 1px 0 rgba(255,255,255,.014)}
.dash-stats span{min-height:72px;padding:11px 7px 10px}
.dash-stats small{letter-spacing:.105em;color:#777e79}
.modes{margin:10px 18px 16px;border-radius:10px;background:rgba(255,255,255,.004)}
.modes button{height:66px;color:#777d79}
.modes button.active{background:transparent!important;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--dash-accent) 72%,transparent)!important;color:#f4f5f3}
.modes button.active:after{left:31%;right:31%;height:1px;box-shadow:0 0 7px color-mix(in srgb,var(--dash-accent) 25%,transparent)}
.modes button.active small{color:color-mix(in srgb,var(--dash-accent) 26%,#8c938e)}
.dash.calibrating .speedometer-svg{animation:oemDialSettle .46s var(--motion-ease)}
@keyframes oemDialSettle{0%{opacity:.72;filter:brightness(.86)}55%{opacity:1;filter:brightness(1.08)}100%{opacity:1;filter:none}}

/* Activation: restrained configurator language around the existing boot sequence. */
.swatches{gap:14px}
.sw{width:28px;height:28px}
.activation-config{margin-top:22px;padding:16px 0 0;border-top:1px solid #252525;display:grid;grid-template-columns:auto 1fr;gap:7px 18px;align-items:baseline}
.activation-config small{grid-column:1/-1;font-size:7px;letter-spacing:.16em;color:#696966}
.activation-config strong{font-family:"Inter Tight","Inter",sans-serif;font-size:18px;font-weight:500;letter-spacing:.025em;color:#f1f1ed}
.activation-config span{justify-self:end;max-width:260px;text-align:right;font-size:9px;line-height:1.45;color:#7f7f7b}
.activation-stage.color-shifting .ambient{animation:finishPulse .42s ease}
.activation-stage.color-shifting .stage-inner img{animation:finishImageSettle .42s var(--motion-ease)}
.activate-btn{position:relative;overflow:hidden;transition:background .3s ease,filter .3s ease,transform .2s ease}
.activate-btn:active{transform:translateY(1px)}
.activate-btn[aria-busy="true"]:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-100%);animation:buttonSweep .78s var(--motion-ease)}
@keyframes finishPulse{0%{opacity:.2}48%{opacity:.72}100%{opacity:var(--finish-opacity,.62)}}
@keyframes finishImageSettle{0%{opacity:.72}100%{opacity:1}}
@keyframes buttonSweep{to{transform:translateX(100%)}}

@media(max-width:980px){
  .gallery-head{gap:18px;align-items:flex-end}
  .gallery-toolbar{margin-left:auto}
  .gallery-meta{width:96px;justify-items:end}
  .rail{margin-right:calc(-1*var(--pad));padding-right:9vw;scroll-padding-inline:6vw;gap:12px}
  .rail figure{min-width:82vw;transform:scale(.985)}
  .rail figure.is-active{transform:none}
  .dash-main{gap:10px}
  .mode-readout{padding:11px 2px 10px}
  .dash-stats span{min-height:70px}
  .modes{margin:9px 14px 12px}
  .modes button{height:62px}
  .activation-config{margin-top:18px;padding-top:13px}
  .activation-config strong{font-size:17px}
  .activation-config span{font-size:8px;max-width:190px}
}
@media(max-width:520px){
  .gallery-head{display:grid;grid-template-columns:1fr auto;align-items:end}
  .gallery-toolbar{align-self:end}
  .gallery-meta{width:82px;gap:7px}
  .gallery-meta>span{font-size:8px}
  .rail{margin-top:38px;padding-right:12vw;scroll-padding-inline:5vw}
  .rail figure{min-width:84vw}
  .dash-stats span{min-height:66px;padding:10px 5px 9px}
  .dash-stats small{font-size:7.5px;letter-spacing:.09em}
  .modes{margin:8px 12px 10px}
  .modes button{height:58px}
  .activation-config{grid-template-columns:1fr;gap:5px}
  .activation-config span{justify-self:start;text-align:left;max-width:30ch}
}
@media(prefers-reduced-motion:reduce){
  .gallery-meta>i>b,.dash.calibrating .speedometer-svg,.activation-stage.color-shifting .ambient,.activation-stage.color-shifting .stage-inner img,.activate-btn[aria-busy="true"]:after{transition:none!important;animation:none!important}
}
'''
          css.write_text(styles + premium_css)
          PY
      - name: Validate production files
        shell: bash
        run: |
          node --check v4.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          css=Path('v4.css').read_text()
          js=Path('v4.js').read_text()
          assert html.count('id="galleryCounter"') == 1
          assert html.count('id="galleryProgress"') == 1
          assert html.count('id="finishName"') == 1
          assert html.count('id="finishDesc"') == 1
          assert 'v4.css?v=9' in html and 'v4.js?v=7' in html
          assert 'Premium Product Pass 2026-09' in css
          assert css.count('{') == css.count('}')
          assert 'scrollGalleryTo' in js and 'applyFinish' in js and 'navSections' in js
          ids=re.findall(r'id="([^"]+)"',html)
          assert len(ids)==len(set(ids)), 'duplicate ids found'
          hrefs=re.findall(r'href="#([^"]+)"',html)
          for anchor in hrefs:
              assert anchor in ids, f'broken anchor #{anchor}'
          print('validation ok:', len(ids), 'ids;', len(css), 'css bytes;', len(js), 'js bytes')
          PY
      - name: Commit premium pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v4.css v4.js
          git rm .github/workflows/premium-product-pass.yml
          git commit -m 'feat: elevate gallery Ride System and activation experience'
          git push origin HEAD:main
