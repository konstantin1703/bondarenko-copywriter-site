name: VANTA premium SVG speedometer

on:
  push:
    paths:
      - '.github/workflows/speedometer-pass.yml'

permissions:
  contents: write

jobs:
  speedometer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild premium speedometer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          css_file = Path('v4.css')
          js_file = Path('v4.js')

          html = index.read_text(encoding='utf-8')
          css = css_file.read_text(encoding='utf-8')
          js = js_file.read_text(encoding='utf-8')

          old_dial = '''<div class="speed-dial">
          <div aria-hidden="true" class="dial-ticks"></div>
          <div aria-hidden="true" class="power-arc"></div>
          <div class="speed-readout"><small>СКОРОСТЬ</small><strong id="speed">084</strong><i>км/ч</i></div>
          <div class="power-readout"><span>МОЩНОСТЬ</span><b id="powerLabel">62%</b></div>
          <div class="power" role="img"><i id="power"></i></div>
          </div>'''

          new_dial = '''<div class="speed-dial">
          <svg aria-hidden="true" class="speedometer-svg" viewBox="0 0 320 320">
          <circle class="speedometer-bezel" cx="160" cy="160" r="136"></circle>
          <circle class="speedometer-track speedometer-track-speed" cx="160" cy="160" r="121" pathLength="100" transform="rotate(135 160 160)"></circle>
          <circle class="speedometer-arc speedometer-arc-speed" cx="160" cy="160" id="speedArc" r="121" pathLength="100" transform="rotate(135 160 160)"></circle>
          <g class="speedometer-ticks" id="speedTicks"></g>
          <circle class="speedometer-track speedometer-track-power" cx="160" cy="160" r="94" pathLength="100" transform="rotate(135 160 160)"></circle>
          <circle class="speedometer-arc speedometer-arc-power" cx="160" cy="160" id="powerArcSvg" r="94" pathLength="100" transform="rotate(135 160 160)"></circle>
          <circle class="speedometer-center" cx="160" cy="160" r="70"></circle>
          </svg>
          <div class="speed-readout"><small>СКОРОСТЬ</small><strong id="speed">084</strong><i>км/ч</i></div>
          <div class="power-readout"><span>МОЩНОСТЬ</span><b id="powerLabel">62%</b></div>
          <div class="power" role="img"><i id="power"></i></div>
          </div>'''

          if old_dial not in html:
              raise SystemExit('speed dial source block not found')
          html = html.replace(old_dial, new_dial, 1)
          html = html.replace('v4.css?v=6', 'v4.css?v=7', 1)
          html = html.replace('v4.js?v=5', 'v4.js?v=6', 1)

          start_marker = '/* source v4-speedometer-premium.css */'
          end_marker = '/* VANTA R1 — Premium Motion + Interaction Pass 2026-09 */'
          start = css.find(start_marker)
          end = css.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('old premium speedometer block markers not found')

          new_speed_css = r'''/* VANTA R1 — Premium SVG speedometer: one precise instrument, no decorative ring stack. */
          .speed-dial{
            min-height:326px;
            position:relative;
            display:grid;
            place-items:center;
            align-content:center;
            background:none!important;
            isolation:isolate;
          }
          .speed-dial:before,.speed-dial:after{content:none!important;display:none!important}
          .speedometer-svg{
            position:absolute;
            z-index:1;
            left:50%;
            top:0;
            width:min(292px,94%);
            aspect-ratio:1;
            transform:translateX(-50%) translateY(-17px);
            overflow:visible;
            pointer-events:none;
          }
          .speedometer-bezel{
            fill:#020303;
            stroke:#151a17;
            stroke-width:1.2;
          }
          .speedometer-track{
            fill:none;
            stroke:#202622;
            stroke-linecap:round;
            stroke-dasharray:75 25;
          }
          .speedometer-track-speed{stroke-width:4.2}
          .speedometer-track-power{stroke-width:2.2;stroke:#1b211e}
          .speedometer-arc{
            fill:none;
            stroke:var(--dash-accent);
            stroke-linecap:round;
            transition:stroke-dasharray .52s var(--motion-ease),stroke .32s ease,opacity .32s ease,filter .32s ease;
          }
          .speedometer-arc-speed{
            stroke-width:5.2;
            stroke-dasharray:31.5 68.5;
            filter:drop-shadow(0 0 4px color-mix(in srgb,var(--dash-accent) 22%,transparent));
          }
          .speedometer-arc-power{
            stroke-width:2.8;
            stroke-dasharray:46.5 53.5;
            opacity:.72;
            stroke:color-mix(in srgb,var(--dash-accent) 72%,#aeb5b0);
            filter:drop-shadow(0 0 2px color-mix(in srgb,var(--dash-accent) 18%,transparent));
          }
          .speedometer-ticks line{
            stroke:#707873;
            stroke-width:1;
            stroke-linecap:round;
            opacity:.42;
          }
          .speedometer-ticks line.is-major{
            stroke:#9ba39e;
            stroke-width:1.35;
            opacity:.7;
          }
          .speedometer-center{
            fill:#030504;
            stroke:#171d19;
            stroke-width:1;
          }
          .speed-readout{
            z-index:2;
            transform:translateY(-22px);
            isolation:auto;
          }
          .speed-readout:before,.speed-readout:after{content:none!important;display:none!important}
          .speed-readout strong{
            font-size:clamp(78px,7vw,116px);
            font-weight:470;
            letter-spacing:-.105em;
            transform:scaleX(.975);
            text-shadow:none;
          }
          .speed-readout small{letter-spacing:.2em;color:#969d98}
          .speed-readout i{letter-spacing:.13em;color:#858c87}
          .dash[data-mode="road"] .speedometer-arc-speed{filter:drop-shadow(0 0 3px rgba(228,71,59,.14))}
          .dash[data-mode="attack"] .speedometer-arc-speed{filter:drop-shadow(0 0 6px rgba(255,37,24,.26))}
          .dash[data-mode="attack"] .speedometer-arc-power{opacity:.88}
          .dash[data-mode="range"] .speedometer-arc-speed{filter:drop-shadow(0 0 3px rgba(46,220,127,.13))}
          .dash[data-mode="range"] .speedometer-arc-power{opacity:.64}
          .dash[data-mode="range"] .dash-screen{background:linear-gradient(180deg,#020604 0%,#020303 100%)!important}
          .dash[data-mode="range"] .dash-screen:before{opacity:.14}
          @media(max-width:980px){
            .speed-dial{min-height:326px}
            .speedometer-svg{width:min(274px,88%);transform:translateX(-50%) translateY(-15px)}
            .speed-readout{transform:translateY(-21px)}
            .speed-readout strong{font-size:88px}
          }
          @media(max-width:420px){
            .speed-dial{min-height:322px}
            .speedometer-svg{width:254px;max-width:86%;transform:translateX(-50%) translateY(-12px)}
            .speed-readout{transform:translateY(-18px)}
            .speed-readout strong{font-size:82px;letter-spacing:-.1em;transform:scaleX(.98)}
            .speed-readout small{letter-spacing:.18em}
          }
          @media(prefers-reduced-motion:reduce){.speedometer-arc{transition:none}}

          '''
          css = css[:start] + new_speed_css + css[end:]

          js_anchor = "  const powerMeter=dash?.querySelector('.power');\n"
          js_insert = "  const powerMeter=dash?.querySelector('.power');\n  const speedArc=document.getElementById('speedArc');\n  const powerArcSvg=document.getElementById('powerArcSvg');\n  const speedTicks=document.getElementById('speedTicks');\n"
          if js_anchor not in js:
              raise SystemExit('JS meter anchor not found')
          js = js.replace(js_anchor, js_insert, 1)

          states_end = "  };\n  let speedAnimation=0;"
          svg_helpers = r'''  };

          const svgNS='http://www.w3.org/2000/svg';
          if(speedTicks&&!speedTicks.childElementCount){
            const count=31;
            for(let i=0;i<count;i+=1){
              const angle=135+(270/(count-1))*i;
              const rad=angle*Math.PI/180;
              const major=i%5===0;
              const inner=major?108:112;
              const outer=119;
              const line=document.createElementNS(svgNS,'line');
              line.setAttribute('x1',String(160+Math.cos(rad)*inner));
              line.setAttribute('y1',String(160+Math.sin(rad)*inner));
              line.setAttribute('x2',String(160+Math.cos(rad)*outer));
              line.setAttribute('y2',String(160+Math.sin(rad)*outer));
              line.classList.add(major?'is-major':'is-minor');
              speedTicks.appendChild(line);
            }
          }
          const setSvgArc=(arc,percent)=>{
            if(!arc)return;
            const clamped=Math.max(0,Math.min(Number(percent)||0,100));
            const visible=75*clamped/100;
            arc.style.strokeDasharray=`${visible.toFixed(2)} ${(100-visible).toFixed(2)}`;
          };
          setSvgArc(speedArc,42);
          setSvgArc(powerArcSvg,62);

          let speedAnimation=0;'''
          if states_end not in js:
              raise SystemExit('JS states end anchor not found')
          js = js.replace(states_end, svg_helpers, 1)

          apply_anchor = "    dash.style.setProperty('--dial',`${s.dial}deg`);\n"
          apply_insert = "    setSvgArc(speedArc,s.speed/2);\n    setSvgArc(powerArcSvg,s.power);\n    dash.style.setProperty('--dial',`${s.dial}deg`);\n"
          if apply_anchor not in js:
              raise SystemExit('JS apply mode anchor not found')
          js = js.replace(apply_anchor, apply_insert, 1)

          index.write_text(html,encoding='utf-8')
          css_file.write_text(css,encoding='utf-8')
          js_file.write_text(js,encoding='utf-8')
          PY

      - name: Validate rebuilt instrument
        shell: bash
        run: |
          set -euo pipefail
          node --check v4.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('v4.css').read_text(encoding='utf-8')
          js=Path('v4.js').read_text(encoding='utf-8')
          assert 'class="speedometer-svg"' in html
          assert 'id="speedArc"' in html and 'id="powerArcSvg"' in html and 'id="speedTicks"' in html
          assert 'class="dial-ticks"' not in html and 'class="power-arc"' not in html
          assert 'v4.css?v=7' in html and 'v4.js?v=6' in html
          assert 'source v4-speedometer-premium.css' not in css
          assert 'Premium SVG speedometer' in css
          assert 'setSvgArc(speedArc,s.speed/2)' in js
          assert css.count('{')==css.count('}')
          class IDs(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if d.get('id'): self.ids.append(d['id'])
          p=IDs(); p.feed(html)
          assert len(p.ids)==len(set(p.ids)), 'duplicate IDs'
          print('Premium SVG speedometer validation: OK')
          PY

      - name: Commit speedometer rebuild
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/speedometer-pass.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rebuild Ride System speedometer with precise SVG geometry'
          git push origin HEAD:main
