name: Product Flow V4 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-flow-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V4 product flow QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, urllib.request

          index_path=Path('index.html')
          css_path=Path('v4.css')
          js_path=Path('v4.js')
          html=index_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')

          # --- HTML / copy / structure ---
          html=html.replace('v4.css?v=21','v4.css?v=22').replace('v4.js?v=13','v4.js?v=14')
          html=html.replace('CONCEPT PRICE','СТОИМОСТЬ')
          html=html.replace('СОХРАНИТЬ CONFIG','СОХРАНИТЬ СБОРКУ')
          html=html.replace('<small>ЧТО ЭТО ДАЁТ</small>','<small>ВЛИЯНИЕ НА R1</small>')
          html=re.sub(r'<p class="config-note">.*?</p>','',html,flags=re.S)
          html=html.replace(
            '<span><small>10→80%</small><b id="cfgCharge">14 мин</b><em id="cfgChargeDelta">−4 мин</em></span>',
            '<span><small>10→80%</small><b id="cfgCharge">14 мин</b><em id="cfgChargeDelta">−4 мин</em></span><span class="config-stat-telemetry"><small>ТЕЛЕМЕТРИЯ</small><b id="cfgTelemetry">LIVE</b><em id="cfgTelemetryDelta">R1 LINK</em></span>'
          )
          html=html.replace(
            '<div id="configActiveModules"></div></div>',
            '<div id="configActiveModules"></div><div class="config-build-tools"><button id="configFactoryReset" type="button"><span>ВЕРНУТЬ FACTORY SETUP</span><i>↺</i></button><button id="configReset" type="button"><span>СБРОСИТЬ СБОРКУ</span><i>×</i></button></div></div>',
            1
          )
          html=html.replace(
            '<label class="request-field"><span>РЕГИОН / ОБЛАСТЬ / ШТАТ</span><input id="reqRegion" name="region" autocomplete="address-level1" placeholder="Регион"/></label>',
            '<label class="request-field smart-location-field"><span>РЕГИОН / ОБЛАСТЬ / ШТАТ</span><input class="smart-location-input" id="reqRegion" name="region" autocomplete="off" placeholder="Начни вводить регион"/><small class="field-hint">Можно выбрать из подсказок или оставить своё значение.</small><div class="location-suggest" id="regionSuggest" role="listbox" hidden></div></label>'
          )
          html=html.replace(
            '<label class="request-field"><span>ГОРОД</span><input id="reqCity" name="city" autocomplete="address-level2" required placeholder="Город"/></label>',
            '<label class="request-field smart-location-field"><span>ГОРОД</span><input class="smart-location-input" id="reqCity" name="city" autocomplete="off" required placeholder="Начни вводить город"/><small class="field-hint">Поиск учитывает выбранную страну и регион.</small><div class="location-suggest" id="citySuggest" role="listbox" hidden></div></label>'
          )
          html=html.replace(
            'VANTA R1 — вымышленный демонстрационный product-concept. Все изображения мотоцикла созданы специально для этого проекта.',
            'VANTA R1 — авторский электрический superbike-концепт. Все изображения мотоцикла созданы специально для этого проекта.'
          )

          # --- Remove legacy Tech Sheet V2 cascade ---
          css=re.sub(r'/\* VANTA R1 — Tech Sheet V2: Russian-first engineering explainer 2026-09 \*/.*?(?=/\* VANTA R1 — Product Flow V3 / Engineering Profile / Configurator / Request 2026-09 \*/)', '', css, flags=re.S)

          # Remove previous V4 block if re-run.
          css=re.sub(r'\n/\* VANTA R1 — Product Flow V4 / QA \+ Checkout Data 2026-09 \*/.*\Z','\n',css,flags=re.S)

          css += r'''

/* VANTA R1 — Product Flow V4 / QA + Checkout Data 2026-09 */

/* Engineering profile close: viewport-persistent, geometrically centered. */
#techSheet[open] #techClose{
  position:fixed!important;
  z-index:10040!important;
  top:calc(env(safe-area-inset-top,0px) + 18px)!important;
  right:max(20px,calc((100vw - min(1040px,calc(100vw - 34px)))/2 + 18px))!important;
  margin:0!important;
  display:block!important;
  place-items:unset!important;
}
#techSheet[open] #techClose:before,#techSheet[open] #techClose:after{
  left:50%!important;top:50%!important;margin:0!important;transform-origin:50% 50%!important;
}
#techSheet[open] #techClose:before{transform:translate(-50%,-50%) rotate(45deg)!important}
#techSheet[open] #techClose:after{transform:translate(-50%,-50%) rotate(-45deg)!important}
.tech-profile-head{padding-right:72px!important}

/* Typography QA: Russian UI is tighter and more readable; engineering English stays tracked. */
.tech-profile-head .tech-sheet-titleblock h2{line-height:.91!important;letter-spacing:-.042em!important}
.tech-profile-group>header h3{font-size:14px!important;letter-spacing:.025em!important;line-height:1.12!important}
.tech-profile-group>header small,.tech-profile-impact small,.tech-conclusion small{letter-spacing:.14em!important}
.tech-profile-metrics h4{font-size:10.5px!important;letter-spacing:.025em!important;line-height:1.25!important}
.tech-profile-metrics p{font-size:10px!important;line-height:1.52!important}
.tech-profile-impact p{font-size:11px!important;line-height:1.55!important}
.tech-conclusion strong{font-size:18px!important;line-height:1.3!important}
.tech-conclusion p{font-size:11px!important;line-height:1.6!important}
.config-step-head strong,.request-step-title strong{letter-spacing:.07em!important}
.config-character small,.config-summary-top small,.config-stats small,.config-active-build small,.factory-setup small,.request-field>span,.request-summary-kicker,.request-summary-head small,.request-summary-stats small,.request-summary-modules>small,.request-summary-code span{letter-spacing:.12em!important}
.config-character strong{font-size:12px!important;line-height:1.4!important}
.config-presets button p{font-size:9px!important;line-height:1.5!important}
.config-presets i,.factory-setup small,.factory-setup strong,.module-index,.config-effect,.config-module>i,.config-finishes button small,.config-active-build small,.config-active-build>#configActiveModules span{font-size:8px!important}
.config-module-copy strong{font-size:11px!important;letter-spacing:.045em!important;line-height:1.25!important}
.config-module-copy small{font-size:9px!important;line-height:1.5!important}
.config-stats b{font-size:14px!important;line-height:1.15!important;font-variant-numeric:tabular-nums lining-nums}
.config-stats em{font-size:8px!important;letter-spacing:.035em!important}
.request-field>span{font-size:8.5px!important}
.request-field input,.phone-prefix,.country-button{font-size:14px!important}
.field-hint,.field-error{font-size:8px!important;line-height:1.45!important}

/* Complete 3x2 engineering summary. */
.config-stats{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.config-stats>span{border-right:1px solid #282c29!important;border-top:0!important;min-height:86px!important;align-content:center}
.config-stats>span:nth-child(3n){border-right:0!important}
.config-stats>span:nth-child(n+4){border-top:1px solid #282c29!important}
.config-stat-telemetry b{color:#f1f3ef!important;letter-spacing:.08em!important}
.config-stat-telemetry.is-off b,.config-stat-telemetry.is-off em{color:#666d67!important}

/* Build reset / factory restore controls. */
.config-active-build{grid-template-columns:auto 1fr!important}
.config-build-tools{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:12px;margin-top:4px;border-top:1px solid #262a27}
.config-build-tools button{min-height:36px;padding:0 11px;border:1px solid #303531;background:#080908;color:#9da39e;display:inline-flex;align-items:center;gap:18px;font-size:8px;letter-spacing:.075em;cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .16s}
.config-build-tools button i{font-style:normal;font-size:13px;line-height:1}
.config-build-tools button:active{transform:translateY(1px)}
.config-build-tools button:hover{border-color:#575e58;color:#f2f3ef}
.config-build-tools button:disabled{opacity:.32;cursor:default}
.config-build-tools button[hidden]{display:none!important}
#configReset{border-color:#49302d;color:#c78e88}
#configReset:hover{border-color:#7c3d35;color:#ff8a80;background:rgba(255,46,27,.03)}

/* Request form: stronger OEM surface and focus language. */
.request-form{background:radial-gradient(circle at 12% 0%,rgba(255,46,27,.035),transparent 24%),linear-gradient(180deg,#0a0b0a,#060706)!important}
.request-step{background:linear-gradient(180deg,rgba(255,255,255,.006),transparent 36%)}
.request-field input,.phone-prefix,.country-button{background:#070807!important;border-color:#343936!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.012)!important;transition:border-color .2s,box-shadow .2s,background .2s!important}
.request-field input:focus,.phone-prefix:focus-visible,.country-button:focus-visible{border-color:#717a72!important;background:#0a0b0a!important;box-shadow:inset 2px 0 0 var(--accent),0 0 0 1px rgba(255,46,27,.08)!important;outline:none!important}
.phone-prefix{position:relative}
.region-symbol.is-empty{position:relative;width:18px;height:18px;min-width:18px;border:1px solid #555d56;border-radius:50%;display:block}
.region-symbol.is-empty:before,.region-symbol.is-empty:after{content:"";position:absolute;inset:3px;border:1px solid #555d56;border-radius:50%}
.region-symbol.is-empty:after{inset:8px 2px auto;height:1px;border:0;border-top:1px solid #555d56;border-radius:0}
.request-complete[hidden]{display:none!important}

/* Searchable region/city suggestion surface. */
.smart-location-field{position:relative}
.location-suggest{position:absolute;z-index:90;left:0;right:0;top:calc(100% - 1px);max-height:250px;overflow:auto;border:1px solid #3a3f3b;background:#090a09;box-shadow:0 22px 55px rgba(0,0,0,.5)}
.location-suggest[hidden]{display:none!important}
.location-suggest button{width:100%;min-height:45px;padding:10px 13px;border:0;border-bottom:1px solid #252925;background:transparent;color:#dfe2de;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer}
.location-suggest button:last-child{border-bottom:0}
.location-suggest button:hover,.location-suggest button.is-active{background:rgba(255,255,255,.035)}
.location-suggest button strong{font-size:10px;font-weight:500;letter-spacing:.02em}
.location-suggest button small{font-size:7px;color:#727a73;letter-spacing:.1em;text-transform:uppercase}
.location-suggest .use-manual strong{color:#ff756a}
.location-suggest-empty{padding:13px;color:#737a74;font-size:9px}

/* Country picker scales to the full ISO database. */
.region-list{max-height:min(52svh,480px)!important}
.region-option strong{font-size:10px!important;letter-spacing:.02em!important}
.region-option small{font-size:9px!important}

/* Copy cleanup. */
.config-summary-top small,.request-summary-head small{color:#858c86!important}

@media(max-width:720px){
  #techSheet[open] #techClose{top:calc(env(safe-area-inset-top,0px) + 14px)!important;right:16px!important}
  .tech-profile-head{padding-right:58px!important}
  .tech-profile-head .tech-sheet-titleblock h2{line-height:.94!important;letter-spacing:-.03em!important}
  .tech-profile-group>header h3{font-size:13px!important}
  .tech-profile-metrics h4{font-size:10px!important}
  .tech-profile-metrics p,.tech-profile-impact p{font-size:10px!important}
  .config-build-tools{justify-content:stretch;display:grid;grid-template-columns:1fr 1fr}
  .config-build-tools button{justify-content:space-between;padding:0 10px;font-size:7.5px}
}
@media(max-width:520px){
  .tech-profile-head .tech-sheet-titleblock h2{font-size:38px!important;line-height:.96!important;letter-spacing:-.025em!important}
  .tech-profile-head .tech-sheet-titleblock>p{font-size:11px!important;line-height:1.55!important}
  .tech-profile-group>header{gap:13px!important}
  .tech-profile-group>header h3{font-size:12.5px!important}
  .tech-profile-metrics article{padding:18px 16px!important}
  .tech-profile-value strong{font-size:52px!important}
  .tech-profile-metrics p{font-size:10.5px!important}
  .tech-profile-impact small{font-size:8px!important}
  .tech-profile-impact p{font-size:10.5px!important}
  .config-stats>span{min-height:92px!important;padding:13px 12px!important}
  .config-stats b{font-size:16px!important}
  .config-stats small{font-size:8px!important}
  .config-stats em{font-size:8.5px!important}
  .config-module-copy strong{font-size:11px!important}
  .config-module-copy small{font-size:9.5px!important}
  .config-effect,.config-module>i,.module-index{font-size:8px!important}
  .config-build-tools{grid-template-columns:1fr}
  .request-field>span{font-size:9px!important}
  .field-hint,.field-error{font-size:8.5px!important}
}
'''

          # --- Full country database (static after build) ---
          current_country_match=re.search(r"  const countries=\[.*?\]\.map\(\(\[iso,name,dial\]\)=>\(\{iso,name,dial\}\)\);",js,re.S)
          countries=[]
          try:
              url='https://raw.githubusercontent.com/mledoze/countries/master/countries.json'
              with urllib.request.urlopen(url,timeout=25) as r:
                  raw=json.load(r)
              for c in raw:
                  iso=(c.get('cca2') or c.get('alpha2') or '').upper()
                  if len(iso)!=2: continue
                  tr=(c.get('translations') or {}).get('rus') or {}
                  name=tr.get('common') or tr.get('official') or (c.get('name') or {}).get('common') or c.get('name') or iso
                  idd=c.get('idd') or {}
                  root=idd.get('root') or ''
                  suffixes=idd.get('suffixes') or []
                  dial=''
                  if root and suffixes: dial=f"{root}{suffixes[0]}"
                  elif root: dial=root
                  else:
                      cc=c.get('callingCode') or []
                      if cc: dial='+'+str(cc[0]).lstrip('+')
                  if not dial: continue
                  countries.append({'iso':iso,'name':str(name),'dial':dial})
              dedup={c['iso']:c for c in countries}
              countries=list(dedup.values())
              priority=['RU','DE','US','AE','KZ','BY','GB','FR','IT','ES','CH','AT','NL','PL','TR','CN','JP','KR','IN','AU','CA']
              rank={iso:i for i,iso in enumerate(priority)}
              countries.sort(key=lambda c:(rank.get(c['iso'],999), c['name'].casefold()))
              if len(countries)<180: raise RuntimeError(f'Country dataset too small: {len(countries)}')
              replacement='  const countries='+json.dumps(countries,ensure_ascii=False,separators=(',',':'))+';'
              if current_country_match:
                  js=js[:current_country_match.start()]+replacement+js[current_country_match.end():]
          except Exception as exc:
              print('Country database fetch failed; keeping current embedded set:',exc)

          # --- Configurator logic: BASE reset, factory restore, telemetry cell ---
          js=js.replace("  let state={preset:'road',modules:new Set(presets.road.modules),tone:'red'};","  let state={preset:'road',modules:new Set(presets.road.modules),tone:'red'};\n  let factoryPreset='road';")
          js=js.replace(
            "  const stats={power:q('cfgPower'),torque:q('cfgTorque'),mass:q('cfgMass'),range:q('cfgRange'),charge:q('cfgCharge')};",
            "  const stats={power:q('cfgPower'),torque:q('cfgTorque'),mass:q('cfgMass'),range:q('cfgRange'),charge:q('cfgCharge'),telemetry:q('cfgTelemetry')};"
          )
          js=js.replace(
            "  const deltas={power:q('cfgPowerDelta'),torque:q('cfgTorqueDelta'),mass:q('cfgMassDelta'),range:q('cfgRangeDelta'),charge:q('cfgChargeDelta')};",
            "  const deltas={power:q('cfgPowerDelta'),torque:q('cfgTorqueDelta'),mass:q('cfgMassDelta'),range:q('cfgRangeDelta'),charge:q('cfgChargeDelta'),telemetry:q('cfgTelemetryDelta')};"
          )
          js=js.replace(
            "  const activeModules=q('configActiveModules'),characterNode=q('configCharacter'),factoryCopy=q('configFactoryCopy');",
            "  const activeModules=q('configActiveModules'),characterNode=q('configCharacter'),factoryCopy=q('configFactoryCopy'),resetBuildBtn=q('configReset'),factoryResetBtn=q('configFactoryReset');"
          )
          js=js.replace(
            "  const detectPreset=()=>Object.entries(presets).find(([,p])=>sameSet(state.modules,p.modules)&&state.tone===p.tone)?.[0]||'custom';",
            "  const detectPreset=()=>{if(state.modules.size===0)return 'base';return Object.entries(presets).find(([,p])=>sameSet(state.modules,p.modules)&&state.tone===p.tone)?.[0]||'custom';};"
          )
          js=js.replace(
            "    const values=calculate(),preset=detectPreset(),profile=preset==='custom'?'CUSTOM':presets[preset].label,modules=[...state.modules];\n    const profileCode=preset==='custom'?'CU':presets[preset].short;",
            "    const values=calculate(),preset=detectPreset(),profile=preset==='base'?'BASE':preset==='custom'?'CUSTOM':presets[preset].label,modules=[...state.modules];\n    const profileCode=preset==='base'?'BS':preset==='custom'?'CU':presets[preset].short;"
          )
          js=js.replace(
            "    stats.power.textContent=`${v.power} кВт`;stats.torque.textContent=`${v.torque} Н·м`;stats.mass.textContent=`${v.mass} кг`;stats.range.textContent=`${v.range} км`;stats.charge.textContent=`${v.charge} мин`;",
            "    stats.power.textContent=`${v.power} кВт`;stats.torque.textContent=`${v.torque} Н·м`;stats.mass.textContent=`${v.mass} кг`;stats.range.textContent=`${v.range} км`;stats.charge.textContent=`${v.charge} мин`;if(stats.telemetry)stats.telemetry.textContent=state.modules.has('telemetry')?'LIVE':'OFF';if(deltas.telemetry)deltas.telemetry.textContent=state.modules.has('telemetry')?'R1 LINK':'НЕ УСТАНОВЛЕНО';stats.telemetry?.parentElement?.classList.toggle('is-off',!state.modules.has('telemetry'));"
          )
          js=js.replace(
            "    if(factoryCopy)factoryCopy.textContent=state.preset==='custom'?'CUSTOM BUILD — ручная конфигурация':presets[state.preset].factory;",
            "    if(factoryCopy)factoryCopy.textContent=state.preset==='base'?'BASE R1 — чистая конфигурация':state.preset==='custom'?'CUSTOM BUILD — ручная конфигурация':presets[state.preset].factory;if(factoryResetBtn){factoryResetBtn.hidden=state.preset!=='custom';factoryResetBtn.disabled=state.preset!=='custom';}if(resetBuildBtn){resetBuildBtn.hidden=state.modules.size===0;resetBuildBtn.disabled=state.modules.size===0;}"
          )
          js=js.replace(
            "  const usePreset=key=>{const p=presets[key];if(!p)return;state={preset:key,modules:new Set(p.modules),tone:p.tone};render();};",
            "  const usePreset=key=>{const p=presets[key];if(!p)return;factoryPreset=key;state={preset:key,modules:new Set(p.modules),tone:p.tone};render();};\n  const resetBuild=()=>{state={preset:'base',modules:new Set(),tone:state.tone};render();};\n  const restoreFactory=()=>usePreset(factoryPreset);"
          )
          js=js.replace(
            "  toneButtons.forEach(btn=>btn.addEventListener('click',()=>{state.tone=btn.dataset.configTone;render();}));",
            "  toneButtons.forEach(btn=>btn.addEventListener('click',()=>{state.tone=btn.dataset.configTone;render();}));\n  resetBuildBtn?.addEventListener('click',resetBuild);\n  factoryResetBtn?.addEventListener('click',restoreFactory);"
          )
          js=js.replace(
            "const original='СОХРАНИТЬ CONFIG';span.textContent='CONFIG СОХРАНЁН';setTimeout(()=>span.textContent=original,1400);",
            "const original='СОХРАНИТЬ СБОРКУ';span.textContent='СБОРКА СОХРАНЕНА';setTimeout(()=>span.textContent=original,1400);"
          )
          js=js.replace(
            "  window.vantaConfig={getSnapshot:snapshot,setTone:t=>{if(['red','green','stealth'].includes(t)){state.tone=t;render();}},render};render();",
            "  window.vantaConfig={getSnapshot:snapshot,setTone:t=>{if(['red','green','stealth'].includes(t)){state.tone=t;render();}},setPreset:usePreset,reset:resetBuild,restoreFactory,render};render();"
          )
          js=js.replace("'ОТКЛЮЧИТЬ DEMO'","'ОТКЛЮЧИТЬ R1'")

          # Store selected delivery ISO for dependent location search.
          js=js.replace(
            "deliveryCountry=c;setFlag(countryFlag,c);countryName.textContent=c.name.toUpperCase();countryButton.classList.remove('is-invalid');",
            "deliveryCountry=c;countryButton.dataset.iso=c.iso;setFlag(countryFlag,c);countryName.textContent=c.name.toUpperCase();countryButton.classList.remove('is-invalid');"
          )

          # Append smart region/city search once.
          js=re.sub(r'\n/\* VANTA R1 — Location Search V4 2026-09 \*/.*\Z','\n',js,flags=re.S)
          js += r'''

/* VANTA R1 — Location Search V4 2026-09 */
(()=>{
  'use strict';
  const countryButton=document.getElementById('countryButton');
  const regionInput=document.getElementById('reqRegion');
  const cityInput=document.getElementById('reqCity');
  const regionBox=document.getElementById('regionSuggest');
  const cityBox=document.getElementById('citySuggest');
  if(!regionInput||!cityInput||!regionBox||!cityBox)return;

  const data={
