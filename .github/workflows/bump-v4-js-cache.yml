name: Bump V4 JS Cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v4-js-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump JS cache version
        run: python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('v4.js?v=14','v4.js?v=15'); p.write_text(s)"
      - name: Commit cache bump
        run: |
          rm -f .github/workflows/bump-v4-js-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: bump v4 js cache version'
          git push
