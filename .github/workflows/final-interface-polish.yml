name: Final interface polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final interface polish
        run: python3 tools/final-interface-polish.py
      - name: Validate production files
        run: |
          node --check v4.js
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          css=Path('v4.css').read_text()
          assert html.count('id="techSheet"') == 1
          assert html.count('class="tech-group"') == 3
          assert css.count('{') == css.count('}')
          print('QA OK')
          PY
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v4.css v4.js
          git rm tools/final-interface-polish.py .github/workflows/final-interface-polish.yml
          git commit -m "feat: polish final VANTA interface"
          git push
