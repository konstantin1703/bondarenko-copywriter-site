name: Apply request modal assets

on:
  push:
    paths:
      - '.github/workflows/apply-request-modal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch locale and index v3
        run: python .github/scripts/patch_request_modal.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html v4-locale-v1.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: localize request locations and load modal v3"
            git push origin HEAD:main
          fi
