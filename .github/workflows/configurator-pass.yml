name: R1 Configurator Pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply configurator pass
        run: python .configurator_patch.py
      - name: Validate production files
        run: |
          node --check v4.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          css=Path('v4.css').read_text()
          ids=re.findall(r'id="([^"]+)"',html)
          assert len(ids)==len(set(ids)), 'duplicate ids'
          assert 'id="configurator"' in html
          assert 'v4.css?v=19' in html and 'v4.js?v=11' in html
          assert css.count('{')==css.count('}')
          print('production validation OK')
          PY
      - name: Commit production update
        run: |
          rm -f .configurator_patch.py .github/workflows/configurator-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add R1 premium configurator and reinforce Tech Sheet"
          git push
