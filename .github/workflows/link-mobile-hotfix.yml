name: Link mobile hotfix
on:
  push:
    paths:
      - 'v4-hotfix-mobile.css'
permissions:
  contents: write
jobs:
  link-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Link hotfix stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<link href="v4.css?v=10" rel="stylesheet"/>'
          new=old+'<link href="v4-hotfix-mobile.css?v=1" rel="stylesheet"/>'
          if 'v4-hotfix-mobile.css?v=1' not in s:
              if old not in s:
                  raise SystemExit('base stylesheet link not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/link-mobile-hotfix.yml
          git commit -m 'fix: load mobile architecture and green-mode hotfix'
          git push origin HEAD:main
