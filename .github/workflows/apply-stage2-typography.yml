name: Apply Stage 2 Typography

on:
  push:
    branches: [main]
    paths:
      - 'v4-typography-v1.css'
      - '.github/workflows/apply-stage2-typography.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index and permanent QA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()
          link = '<link href="v4-typography-v1.css?v=1" rel="stylesheet"/>'
          anchor = '<link href="v4-request-modal-v1.css?v=6" rel="stylesheet"/>'
          if link not in html:
              if anchor not in html:
                  raise SystemExit('request modal CSS anchor not found')
              html = html.replace(anchor, anchor + link, 1)
              index.write_text(html)

          smoke = Path('.github/scripts/smoke_qa.mjs')
          s = smoke.read_text()
          if "const typographyCss=fs.readFileSync('v4-typography-v1.css','utf8');" not in s:
              s = s.replace(
                  "  const modalCss=fs.readFileSync('v4-request-modal-v1.css','utf8');\n",
                  "  const modalCss=fs.readFileSync('v4-request-modal-v1.css','utf8');\n  const typographyCss=fs.readFileSync('v4-typography-v1.css','utf8');\n",
                  1
              )
          if "typography cache-bust must be v1" not in s:
              s = s.replace(
                  "  expectStatic(html.includes('v4-request-modal-v1.css?v=6'),'request modal CSS cache-bust must be v6');\n",
                  "  expectStatic(html.includes('v4-request-modal-v1.css?v=6'),'request modal CSS cache-bust must be v6');\n  expectStatic(html.includes('v4-typography-v1.css?v=1'),'typography cache-bust must be v1');\n  expectStatic(typographyCss.includes('Stage 2 / selective functional typography pass'),'stage 2 typography layer missing');\n",
                  1
              )

          marker = "    const phoneSemantics=await page.evaluate(()=>{\n"
          if 'functional typography below stage-2 floor' not in s:
              block = r'''    const functionalType=await page.evaluate(()=>{
      const selectors=[
        ['config summary label','.config-stats small',8.5],
        ['config module description','.config-module-copy small',10],
        ['config module effect','.config-effect',8.5],
        ['config action','.config-actions button',9]
      ];
      return selectors.map(([name,selector,min])=>{
        const el=document.querySelector(selector);
        return {name,selector,min,size:el?parseFloat(getComputedStyle(el).fontSize):null};
      });
    });
    const tooSmallFunctional=functionalType.filter(row=>row.size===null||row.size+0.01<row.min);
    if(tooSmallFunctional.length)fail(scope,`functional typography below stage-2 floor: ${tooSmallFunctional.map(x=>`${x.name}:${x.size}px<${x.min}px`).join(', ')}`);

'''
              if marker not in s:
                  raise SystemExit('smoke runtime insertion marker not found')
              s = s.replace(marker, block + marker, 1)

          modal_marker = "    if(!modalState.headerInert||!modalState.heroInert)fail(scope,'background is not inert while request modal is open');\n"
          if 'request functional typography below stage-2 floor' not in s:
              block = r'''    const requestType=await page.evaluate(()=>{
      const selectors=[
        ['request progress','.request-progress span',9],
        ['request field label','.request-field>span',9],
        ['request hint','.field-hint',innerWidth<=600?10:9.5],
        ['request action','.request-controls button',innerWidth<=600?9.5:9],
        ['request summary label','.request-summary-head small',8.5]
      ];
      return selectors.map(([name,selector,min])=>{
        const el=document.querySelector(selector);
        return {name,selector,min,size:el?parseFloat(getComputedStyle(el).fontSize):null};
      });
    });
    const requestTooSmall=requestType.filter(row=>row.size===null||row.size+0.01<row.min);
    if(requestTooSmall.length)fail(scope,`request functional typography below stage-2 floor: ${requestTooSmall.map(x=>`${x.name}:${x.size}px<${x.min}px`).join(', ')}`);
    const modalOverflow=await page.evaluate(()=>({sw:document.getElementById('request')?.scrollWidth||0,cw:document.getElementById('request')?.clientWidth||0}));
    if(modalOverflow.sw>modalOverflow.cw+3)fail(scope,`request modal horizontal overflow ${modalOverflow.sw}px > ${modalOverflow.cw}px`);
'''
              if modal_marker not in s:
                  raise SystemExit('modal runtime insertion marker not found')
              s = s.replace(modal_marker, modal_marker + block, 1)

          smoke.write_text(s)
          PY
      - name: Commit stage 2 integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-stage2-typography.yml
          git add index.html .github/scripts/smoke_qa.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: integrate stage 2 typography and QA'
          git push origin HEAD:main
