name: Finish full QA cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-full-qa-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final QA cleanup
        run: python3 .github/scripts/finish_full_qa_cleanup.py
      - name: Syntax checks
        run: |
          node --check v4.js
          node --check v4-locale-v1.js
          node --check v4-request-modal-v1.js
          node --check .github/scripts/full_qa.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish typography and QA cleanup"
          git push origin HEAD:main
