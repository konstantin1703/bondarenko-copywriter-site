name: Gallery close and mode indicator fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cssp=Path('v4.css')
          htmlp=Path('index.html')
          css=cssp.read_text()
          html=htmlp.read_text()
          marker='/* VANTA R1 — gallery close + single OEM mode indicator 2026-09 */'
          if marker not in css:
              css += '''\n\n/* VANTA R1 — gallery close + single OEM mode indicator 2026-09 */\n.modes button.active{box-shadow:none!important}\n.modes button.active:after{\n  content:\"\"!important;\n  position:absolute!important;\n  left:20%!important;\n  right:20%!important;\n  bottom:7px!important;\n  height:2px!important;\n  border-radius:999px!important;\n  background:var(--dash-accent)!important;\n  box-shadow:0 0 6px color-mix(in srgb,var(--dash-accent) 24%,transparent)!important;\n}\n.gallery-lightbox-close{\n  position:relative;\n  display:grid;\n  place-items:center;\n  width:46px;\n  height:46px;\n  border-radius:50%;\n  border:1px solid #4a4d4a;\n  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.055),transparent 34%),#090a09;\n  color:transparent;\n  font-size:0;\n  line-height:0;\n  appearance:none;\n  -webkit-appearance:none;\n  -webkit-tap-highlight-color:transparent;\n  outline:none!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 8px 22px rgba(0,0,0,.28);\n  transition:transform .18s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;\n}\n.gallery-lightbox-close:before,.gallery-lightbox-close:after{\n  content:\"\";\n  position:absolute;\n  width:17px;\n  height:1.5px;\n  border-radius:99px;\n  background:#e8eae7;\n  box-shadow:0 0 5px rgba(255,255,255,.08);\n}\n.gallery-lightbox-close:before{transform:rotate(45deg)}\n.gallery-lightbox-close:after{transform:rotate(-45deg)}\n.gallery-lightbox-close:focus{outline:none!important}\n.gallery-lightbox-close:active{\n  transform:scale(.94);\n  border-color:color-mix(in srgb,var(--accent) 70%,#575957);\n  background:#0d0908;\n  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent),0 0 16px color-mix(in srgb,var(--accent) 12%,transparent);\n}\n@media(hover:hover) and (pointer:fine){\n  .gallery-lightbox-close:hover{border-color:#777b77;background:#101110;transform:translateY(-1px)}\n  .gallery-lightbox-close:focus-visible{outline:none!important;box-shadow:0 0 0 1px #c9ccc9,0 0 0 4px rgba(255,46,27,.12),0 8px 22px rgba(0,0,0,.28)}\n}\n@media(max-width:520px){\n  .modes button.active:after{left:18%!important;right:18%!important;bottom:7px!important;height:2px!important}\n  .gallery-lightbox-close{width:44px;height:44px}\n}\n'''
          html=html.replace('v4.css?v=13','v4.css?v=14')
          cssp.write_text(css)
          htmlp.write_text(html)
          PY
          python3 - <<'PY'
          from pathlib import Path
          css=Path('v4.css').read_text(); html=Path('index.html').read_text()
          assert css.count('{')==css.count('}')
          assert 'v4.css?v=14' in html
          assert 'gallery close + single OEM mode indicator' in css
          print('QA OK')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4.css index.html
          git rm .github/workflows/gallery-close-mode-indicator-fix.yml
          git commit -m "fix: refine gallery close control and mode indicator"
          git push
