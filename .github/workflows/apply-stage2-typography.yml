name: Apply Stage 2 Typography

on:
  push:
    branches: [main]
    paths:
      - 'v4-typography-v1.css'
      - '.github/scripts/apply_stage2.py'
      - '.github/workflows/apply-stage2-typography.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply typography integration
        run: python3 .github/scripts/apply_stage2.py
      - name: Commit integration and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/scripts/apply_stage2.py .github/workflows/apply-stage2-typography.yml
          git add index.html .github/scripts/smoke_qa.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: integrate stage 2 typography and QA'
          git push origin HEAD:main
