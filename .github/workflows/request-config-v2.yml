name: R1 Configurator V2 Request Flow
on:
  push:
    paths:
      - '.github/workflows/request-config-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Configurator V2 and Request Flow
        run: python .qa/request-config-v2.py
      - name: Validate production files
        run: |
          node --check v4.js
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          css=Path('v4.css').read_text()
          ids=re.findall(r'id="([^"]+)"',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, dup
          assert css.count('{')==css.count('}')
          assert 'v4.css?v=20' in html
          assert 'v4.js?v=12' in html
          assert 'id="request"' in html
          assert 'id="regionPicker"' in html
          print('validation ok')
          PY
      - name: Commit production update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add premium application flow and audit configurator' || exit 0
          git push
