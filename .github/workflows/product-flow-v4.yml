  const countryIso=()=>countryButton?.dataset.iso||'';
  const normalize=s=>String(s||'').toLocaleLowerCase('ru').trim();
  const cityPool=()=>{
    const set=data[countryIso()];if(!set)return [];
    const region=regionInput.value.trim();
    if(set.cities?.[region])return set.cities[region];
    return [...new Set(Object.values(set.cities||{}).flat())];
  };
  const regionPool=()=>data[countryIso()]?.regions||[];

  const bind=(input,box,getPool,label)=>{
    let active=-1;
    const render=()=>{
      const query=normalize(input.value);const pool=getPool();
      let rows=pool.filter(x=>!query||normalize(x).includes(query)).slice(0,10);
      const exact=rows.some(x=>normalize(x)===query);
      const manual=input.value.trim();
      box.innerHTML=rows.map((x,i)=>`<button type="button" data-value="${x.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" class="${i===active?'is-active':''}"><strong>${x}</strong><small>${label}</small></button>`).join('')+(manual&&!exact?`<button type="button" class="use-manual" data-value="${manual.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><strong>Использовать «${manual}»</strong><small>РУЧНОЙ ВВОД</small></button>`:'');
      if(!box.innerHTML)box.innerHTML='<div class="location-suggest-empty">Начни вводить — значение можно оставить вручную.</div>';
      box.hidden=false;active=-1;
    };
    input.addEventListener('focus',render);
    input.addEventListener('input',render);
    input.addEventListener('keydown',e=>{
      const buttons=[...box.querySelectorAll('button')];
      if(e.key==='Escape'){box.hidden=true;return;}
      if(!['ArrowDown','ArrowUp','Enter'].includes(e.key))return;
      if(e.key==='Enter'&&active<0){box.hidden=true;return;}
      e.preventDefault();
      if(e.key==='ArrowDown')active=Math.min(active+1,buttons.length-1);
      if(e.key==='ArrowUp')active=Math.max(active-1,0);
      if(e.key==='Enter'&&buttons[active]){input.value=buttons[active].dataset.value||'';box.hidden=true;input.dispatchEvent(new Event('change',{bubbles:true}));return;}
      buttons.forEach((b,i)=>b.classList.toggle('is-active',i===active));buttons[active]?.scrollIntoView({block:'nearest'});
    });
    box.addEventListener('pointerdown',e=>{const btn=e.target.closest('button[data-value]');if(!btn)return;e.preventDefault();input.value=btn.dataset.value||'';box.hidden=true;input.dispatchEvent(new Event('change',{bubbles:true}));});
  };
  bind(regionInput,regionBox,regionPool,'РЕГИОН');
  bind(cityInput,cityBox,cityPool,'ГОРОД');
  regionInput.addEventListener('change',()=>{if(cityInput.value)cityInput.value='';});
  countryButton?.addEventListener('click',()=>{regionBox.hidden=true;cityBox.hidden=true;});
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('.smart-location-field')){regionBox.hidden=true;cityBox.hidden=true;}});
})();
'''

